const iconAliases={"dashboard": "layout-dashboard", "tasks": "square-check", "customers": "users", "deals": "briefcase-business", "meetings": "calendar", "flows": "workflow"};
const icon=k=>lucideIcons[iconAliases[k]||k]||lucideIcons['square-check'];
function go(next){recordEdit=null;const t=db.tasks.find(t=>t.id===taskContextId);if(t){const destination=taskDestination(t),base=destination.split('/').slice(0,2).join('/');const keep=destination.startsWith('meeting/')?next.startsWith(base+'/')&&['action','document'].includes(next.split('/')[2]):destination.startsWith('deal/')?next===destination:next===destination;if(!keep)taskContextId=null;}route=next;manualFlow=null;workflowPickerTask=null;workflowSelection=null;editing=false;search='';activityQuery='';activityKind='all';if(globalThis.history&&globalThis.location)history.pushState({route,taskContextId},'', '#/'+route);render()}
function toast(s){$('#status').innerHTML=`<div class="toast">${e(s)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#status').innerHTML='',2500)}
function heading(title,sub='',action=''){return `<div class="heading"><div><h1>${e(title)}</h1>${sub?`<p>${e(sub)}</p>`:''}</div>${action}</div>`}
const card=(title,body,extra='')=>`<section class="card"><div class="card-head"><h2>${e(title)}</h2>${extra}</div>${body}</section>`;
const crumb=(label,to,current)=>`<div class="crumb">${link(label,to)}<span> / </span><span>${e(current)}</span></div>`;
const props=items=>`<dl class="properties">${items.map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join('')}</dl>`;
function relatedItem(label,to,type='資料'){const glyph=type.includes('メール')?'mail':type==='コール'?'phone':/ミーティング|商談記録|打ち合わせ/.test(type)?'calendar':type==='タスク'?'square-check':'file-text';return `<a class="related-chip" href="#/${e(to)}" data-go="${e(to)}">${icon(glyph)}<span>${e(label)}</span></a>`}
function sources(ids){return `<div class="sources related-items">${ids.map(id=>{const a=db.activities.find(x=>x.id===id);return a?relatedItem(a.title,'activity/'+id,a.type):''}).join('')}</div>`}
function taskDestination(t){return 'task/'+t.id}
function restoreTaskContext(){const t=db.tasks.find(t=>t.id===taskContextId);if(!t){taskContextId=null;return}const destination=taskDestination(t),base=destination.split('/').slice(0,2).join('/');const valid=destination.startsWith('meeting/')?route.startsWith(base+'/')&&['action','document'].includes(route.split('/')[2]):route===destination;if(!valid)taskContextId=null}
function contextTask(dealId){return db.tasks.find(t=>t.id===taskContextId&&t.dealId===dealId)}
function businessCrumb(d,title,to,action=false){const task=db.tasks.find(t=>t.id===taskContextId&&t.dealId===d.id);return `<div class="crumb">${link('案件','deals')}<svg aria-hidden="true" class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="m9 18 6-6-6-6" /> </svg>${link(d.name,'deal/'+d.id+'/activities')}<svg aria-hidden="true" class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="m9 18 6-6-6-6" /> </svg>${task?link(task.title,taskDestination(task)):link(title,to)}${action?'<svg aria-hidden="true" class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="m9 18 6-6-6-6" /> </svg><span>対応内容</span>':''}</div>`}
function dealOverview(d){if(overviewState[d.id]==='loading')return card('概要','<div class="pad" role="status">AIが案件の記録を要約しています…</div>');if(!overviewState[d.id]){overviewState[d.id]='loading';setTimeout(()=>{overviewState[d.id]='ready';if(route==='deal/'+d.id+'/overview')render()},450);return card('概要','<div class="pad" role="status">AIが案件の記録を要約しています…</div>')}const records=db.activities.filter(a=>a.dealId===d.id&&a.type!=='活動記録');return card('AIによる要約',`<div class="pad"><p>${e(d.name)}は${e(d.stage)}、担当は${e(d.owner)}です。</p><p class="section-gap">${e(records.length?records.slice(0,3).map(a=>a.body.slice(0,130)).join('\n'):company(d.company).summary)}</p>${sources(records.slice(0,3).map(a=>a.id))}</div>`,btn('再生成','overview-refresh:'+d.id))}

function recordSummary(d){const c=company(d.company);return card('案件情報',`<dl class="record-props pad"><dt>案件</dt><dd>${link(d.name,'deal/'+d.id+'/activities')}</dd><dt>ステージ</dt><dd>${badge(d.stage)}</dd><dt>担当</dt><dd>${assignee(d.owner||'Wada')}</dd><dt>顧客</dt><dd>${link(c.name,'customer/'+c.id)}</dd><dt>窓口</dt><dd>${e(c.person)}<div class="small muted email-address">${e(c.email)}</div></dd><dt>案件金額</dt><dd>${yen(d.amount)}</dd></dl>`)}
function mailHistory(dealId,exclude){const mails=db.activities.filter(a=>a.dealId===dealId&&a.id!==exclude&&['受信メール','送信メール'].includes(a.type));return mails.length?card('これまでのやり取り',mails.sort((a,b)=>b.date.localeCompare(a.date)).map(a=>`<article class="listline record-clickable" role="link" tabindex="0" data-record-go="activity/${a.id}"><div class="row between"><b>${e(a.title)}</b>${badge(a.type)}</div><p class="small muted">${e(a.date)} · ${e(company(a.company).person)}</p><div class="prose small section-gap">${e(a.body)}</div></article>`).join('')):''}
function taskRows(tasks){return tasks.map(t=>`<div class="task"><div class="task-symbol">${icon('tasks')}</div><div><div class="task-title">${link(t.title,taskDestination(t))}</div><div class="task-meta">${e(company(t.company).name)}<span>·</span>${e(t.kind)}<span>·</span>${e(t.due)}</div></div><div class="task-actions">${badge(t.status==='done'?'完了':'ToDo',t.status==='done'?'green':'')}${`<button class="btn small" data-go="${taskDestination(t)}">${t.kind.includes('確認')?'確認する':'開く'}</button>`}</div></div>`).join('')||'<div class="empty">タスクはありません</div>'}
function assignee(name='Wada'){return `<span class="assignee"><span class="avatar">${e(name==='AI'?'AI':name.slice(0,2).toUpperCase())}</span>${e(name)}</span>`}
function dueLabel(date){return `<span class="due-label">${icon('meetings')}<span>${e(date)}</span></span>`}
function tasksPage(){const ts=db.tasks.filter(t=>!needsMyAction||(!t.owner||t.owner==='Wada')),modes={human:'人',ai:'AI',collaborative:'人＋AI'};return heading('タスク')+`<div class="tabs"><button data-action="task-owner:self" class="${needsMyAction?'active':''}">自分</button><button data-action="task-owner:all" class="${!needsMyAction?'active':''}">すべて</button></div>`+`<div class="task-board">${[['open','ToDo'],['running','Doing'],['done','Done']].map(([state,label])=>{const items=ts.filter(t=>t.status===state);return `<section class="kanban-col state-${state}"><div class="kanban-heading"><b>${label}<span class="count">${items.length}</span></b></div>${items.map(t=>`<button class="deal-card task-record" data-action="open-task:${t.id}"><h3 style="margin:0 0 8px">${e(t.title)}</h3><div class="small muted">${e(company(t.company).name)}</div><div class="small muted task-owner">${assignee(t.owner||'Wada')}</div><div class="small muted section-gap">${dueLabel(t.due)}</div></button>`).join('')||'<div class="small muted">タスクはありません</div>'}</section>`}).join('')}</div>`}
function dashboardStats(){const deals=db.deals.filter(d=>d.close>=db.goal.start&&d.close<=db.goal.end),won=deals.filter(d=>d.stage==='受注'),actual=won.reduce((n,d)=>n+d.amount,0),forecast=deals.reduce((n,d)=>n+d.amount*({受注:1,提案中:.5,ヒアリング:.2}[d.stage]||0),0);return {deals,won,actual,forecast,rate:actual/db.goal.amount*100}}
function meetingKpi(){const actual=db.activities.filter(a=>a.type==='商談記録'&&a.date.slice(0,10)>=db.meetingGoal.start&&a.date.slice(0,10)<=db.meetingGoal.end).length;return {actual,target:db.meetingGoal.count,rate:Math.round(actual/db.meetingGoal.count*100)}}
function dashboardCharts(){const s=dashboardStats(),k=meetingKpi(),days=Array.from({length:26},(_,i)=>'2026-10-'+String(i+1).padStart(2,'0')),amounts=days.map(day=>s.won.filter(d=>d.close<=day).reduce((n,d)=>n+d.amount,0)),meetings=days.map(day=>db.activities.filter(a=>a.type==='商談記録'&&a.date.slice(0,10)===day).length),max=Math.max(1,...amounts),maxMeet=Math.max(1,...meetings);return `<div class="summary-grid four"><div class="stat"><span>四半期受注目標（10–12月）</span><strong>${db.goal.amount/10000}<small> 万円</small></strong></div><div class="stat"><span>受注実績</span><strong>${s.actual/10000}<small> 万円</small></strong></div><div class="stat"><span>達成率</span><strong>${Math.round(s.rate)}<small> %</small></strong></div><div class="stat"><span>受注見込み</span><strong>${s.forecast/10000}<small> 万円</small></strong></div></div><div class="chart-grid">${card('日別の累計受注実績',`<div class="pad"><div class="small muted">10/1 — 10/26 · 最大 ${yen(max)}</div><svg viewBox="0 0 520 160" role="img" aria-label="日別の累計受注実績"><path d="M10 140H510" stroke="#e4e4e7"/><polyline fill="none" stroke="#2563eb" stroke-width="3" points="${amounts.map((v,i)=>(10+i*20)+','+(140-v/max*120)).join(' ')}"/>${amounts.map((v,i)=>`<circle cx="${10+i*20}" cy="${140-v/max*120}" r="4" fill="#2563eb"><title>${days[i]}: ${yen(v)}</title></circle>`).join('')}</svg><div class="row between small muted"><span>10/1</span><span>10/13</span><span>10/26</span></div></div>`)}${card('日別の商談実施件数',`<div class="pad"><div class="row between"><b>10月の商談目標 ${k.target}件</b><span>実績 ${k.actual}件 · 達成率 ${k.rate}%</span></div><div class="bar" style="margin:12px 0 16px" role="progressbar" aria-label="10月の商談目標達成率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.min(100,k.rate)}"><i style="width:${Math.min(100,k.rate)}%;background:#2563eb"></i></div><div class="small muted">10/1 — 10/26の商談記録 · 最大 ${maxMeet}件/日</div><svg viewBox="0 0 520 160" role="img" aria-label="日別の商談実施件数">${meetings.map((v,i)=>`<rect x="${i*20+3}" y="${140-v/maxMeet*120}" width="14" height="${v/maxMeet*120}" rx="2" fill="#60a5fa"><title>${days[i]}: ${v}件</title></rect>`).join('')}</svg><div class="row between small muted"><span>10/1</span><span>10/13</span><span>10/26</span></div></div>`)}</div>`}
function metricRecords(metric,day){const start=day||'2026-10-01',end=day||'2026-10-31';return metric==='meetings'?db.activities.filter(a=>a.type==='商談記録'&&a.date.slice(0,10)>=start&&a.date.slice(0,10)<=end).map(a=>({title:a.title,date:a.date,company:a.company,owner:a.actor||deal(a.dealId).owner,to:'activity/'+a.id})):db.deals.filter(d=>d.stage==='受注'&&d.close>=start&&d.close<=end).map(d=>({title:d.name,date:d.close,company:d.company,owner:d.owner,to:'deal/'+d.id}))}
function metricTable(metric,day){const rows=metricRecords(metric,day).slice().sort((a,b)=>b.date.localeCompare(a.date));return crumb('ダッシュボード','dashboard',metric==='meetings'?'商談実施':'受注')+heading(metric==='meetings'?'商談一覧':metric==='amount'?'受注案件一覧':'受注案件一覧',(day||'2026年10月')+' · '+rows.length+'件')+card('記録一覧',`<div class="table-wrap"><table><thead><tr><th>件名</th><th>顧客</th><th>日付</th><th>担当</th>${metric==='amount'?'<th>金額</th>':''}</tr></thead><tbody>${rows.map(r=>`<tr><td>${link(r.title,r.to)}</td><td>${e(company(r.company).name)}</td><td>${e(r.date)}</td><td>${assignee(r.owner)}</td>${metric==='amount'?`<td>${yen(deal(r.to.split('/')[1]).amount)}</td>`:''}</tr>`).join('')||'<tr><td colspan="4">該当する記録はありません</td></tr>'}</tbody></table></div>`)}
function countChart(metric){const days=Array.from({length:31},(_,i)=>'2026-10-'+String(i+1).padStart(2,'0')),counts=days.map(day=>metricRecords(metric,day).length),max=Math.max(2,...counts),name=metric==='meetings'?'商談実施':'受注';return card('日別の'+name+'件数',`<div class="pad"><svg viewBox="0 0 600 220" role="img" aria-label="10月の日別${name}件数"><text x="0" y="15" font-size="12" fill="#71717a">件</text>${[0,Math.ceil(max/2),max].map(n=>`<path d="M30 ${180-n/max*150}H590" stroke="#e4e4e7"/><text x="15" y="${184-n/max*150}" text-anchor="end" font-size="11" fill="#71717a">${n}</text>`).join('')}${counts.map((n,i)=>`<a href="#/metric/${metric}/${days[i]}" data-metric-route="metric/${metric}/${days[i]}" aria-label="${days[i]} ${n}件の記録"><rect x="${32+i*18}" y="${180-n/max*150}" width="13" height="${n/max*150}" rx="2" fill="#60a5fa"><title>${days[i]}: ${n}件</title></rect></a>`).join('')}${[0,9,19,30].map(i=>`<text x="${38+i*18}" y="207" text-anchor="middle" font-size="11" fill="#71717a">10/${i+1}</text>`).join('')}</svg></div>`,link('もっと見る','metric/'+metric))}
function dashboard(){const money=dashboardStats();return heading('ダッシュボード','2026年10月')+`<div class="summary-grid" style="grid-template-columns:1fr 1fr">${[['meetings','商談数',db.meetingGoal.count],['won','受注数',db.wonGoal.count]].map(([metric,name,target])=>{const actual=metricRecords(metric).length,rate=Math.round(actual/target*100);return card(name,`<div class="pad stat-body"><strong>${actual}<small> 件</small></strong><div class="small muted">達成率 ${rate}%</div><div class="bar" style="margin-top:16px"><i style="width:${Math.min(rate,100)}%;background:#2563eb"></i></div></div>`,link('もっと見る','metric/'+metric))}).join('')}</div><div class="chart-grid">${countChart('meetings')}${countChart('won')}</div>`+card('受注金額',`<div class="pad stat-body"><strong>${money.actual/10000}<small> 万円</small></strong><div class="small muted">目標 ${db.goal.amount/10000}万円 · 達成率 ${Math.round(money.rate)}%</div><div class="bar section-gap"><i style="width:${Math.min(money.rate,100)}%;background:#2563eb"></i></div><p class="small muted section-gap">受注見込み ${yen(money.forecast)}</p></div>`,link('もっと見る','metric/amount'))}



function originalListPage(type){let title,headers,rows;if(type==='customers'){title='顧客';headers=['会社名','担当窓口','業種','担当'];rows=db.companies.map(c=>[link(c.name,'customer/'+c.id),e(c.person),e(c.industry),'Wada'])}else if(type==='deals'){title='案件';headers=['案件名','顧客','進捗','案件金額','受注予定日'];rows=db.deals.map(d=>[link(d.name,'deal/'+d.id),e(company(d.company).name),badge(d.stage),yen(d.amount),e(d.close)])}else{title='商談・活動';headers=['件名','顧客','日時','種類'];rows=db.meetings.map(m=>[link(m.name,'meeting/'+m.id+'/brief'),e(company(deal(m.deal).company).name),m.date,'商談予定']).concat(db.activities.map(a=>[link(a.title,'activity/'+a.id),e(company(a.company).name),a.date,a.type]))}return heading(title)+`<div class="card table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function listSearch(withDeals){return `<form id="list-search" class="row" style="margin-bottom:20px"><input class="search" aria-label="顧客・案件を検索" name="query" value="${e(search)}" placeholder="${withDeals?'顧客名・案件名':'顧客名・窓口'}で検索">${withDeals?`<select name="stage" aria-label="ステージ" style="width:140px">${['all','ヒアリング','提案中','受注'].map(x=>`<option value="${x}" ${dealStage===x?'selected':''}>${x==='all'?'全ステージ':x}</option>`).join('')}</select><select name="owner" aria-label="担当" style="width:140px">${['all',...demoOwners].map(x=>`<option value="${x}" ${dealOwner===x?'selected':''}>${x==='all'?'全担当':x}</option>`).join('')}</select>`:''}<button class="btn" type="submit">絞り込む</button><button class="btn" type="button" data-action="clear-search">クリア</button></form>`}
let customerSort={key:'name',dir:1};
function customerRows(){return db.companies.filter(c=>(c.name+' '+c.person).includes(search)).map(c=>({...c,count:db.deals.filter(d=>d.company===c.id).length,last:db.activities.filter(a=>a.company===c.id&&['受信メール','送信メール','商談記録'].includes(a.type)).map(a=>a.date).sort().at(-1)||''})).sort((a,b)=>(typeof a[customerSort.key]==='number'?a[customerSort.key]-b[customerSort.key]:String(a[customerSort.key]).localeCompare(String(b[customerSort.key]),'ja'))*customerSort.dir)}
function listPage(type){if(type==='customers'){const cs=customerRows();return heading('顧客')+listSearch(false)+`<div class="card table-wrap"><table><thead><tr>${[['name','会社名'],['person','窓口'],['industry','業種'],['owner','担当'],['count','案件数'],['last','最終連絡日']].map(([key,label])=>`<th><button class="sort-button" data-action="customer-sort:${key}">${label} ${customerSort.key===key?(customerSort.dir===1?icon('arrow-up'):icon('arrow-down')):icon('arrow-up-down')}</button></th>`).join('')}</tr></thead><tbody>${cs.map(c=>`<tr><td>${link(c.name,'customer/'+c.id)}</td><td>${e(c.person)}</td><td>${e(c.industry)}</td><td>${assignee(c.owner)}</td><td>${c.count}件</td><td>${c.last?e(c.last.slice(0,10)):'—'}</td></tr>`).join('')||'<tr><td colspan="6">該当する顧客はありません</td></tr>'}</tbody></table></div>`;}if(type==='deals'){const visibleDeals=db.deals.filter(d=>(d.name+' '+company(d.company).name).includes(search)&&(dealStage==='all'||d.stage===dealStage)&&(dealOwner==='all'||d.owner===dealOwner));const list=dealView==='list';return heading('案件')+listSearch(true)+`<div class="tabs"><button class="${!list?'active':''}" data-action="view-kanban">カンバン</button><button class="${list?'active':''}" data-action="view-list">一覧</button></div>`+(list?`<div class="card table-wrap"><table><thead><tr><th>案件名</th><th>顧客</th><th>ステージ</th><th>受注予定日</th><th>担当</th></tr></thead><tbody>${visibleDeals.map(d=>`<tr><td>${link(d.name,'deal/'+d.id)}</td><td>${e(company(d.company).name)}</td><td>${badge(d.stage)}</td><td>${dueLabel(d.close)}</td><td>${assignee(d.owner||'Wada')}</td></tr>`).join('')}</tbody></table></div>`:`<div class="kanban">${['ヒアリング','提案中','受注'].map(stage=>{const ds=visibleDeals.filter(d=>d.stage===stage);return `<section class="kanban-col stage-${stage}"><div class="kanban-heading"><b>${stage}<span class="count">${ds.length}件</span></b></div>${ds.map(d=>`<button class="deal-card deal-record" data-go="deal/${d.id}"><span class="deal-card-title">${e(d.name)}</span><span class="small muted">${e(company(d.company).name)}</span><span class="small muted">${assignee(d.owner||'Wada')}</span><span class="row between small muted section-gap">${dueLabel(d.close)}</span></button>`).join('')}</section>`}).join('')}</div>`)}return heading('活動')+db.companies.map(c=>{let entries=[...db.activities.filter(a=>a.company===c.id).map(a=>({title:a.title,date:a.date,dealId:a.dealId,type:a.type,to:'activity/'+a.id})),...db.meetings.filter(m=>deal(m.deal).company===c.id).map(m=>({title:m.name,date:m.date,dealId:m.deal,type:'打ち合わせ',to:'meeting/'+m.id+'/brief'}))].sort((a,b)=>b.date.localeCompare(a.date));return card(c.name,entries.map(a=>`<div class="listline row between"><div>${link(a.title,a.to)}<div class="small muted">${a.dealId?e(deal(a.dealId).name):'顧客全体'} · ${a.type}</div></div><span class="small muted">${a.date}</span></div>`).join('')||'<div class="pad muted">活動はありません</div>')}).join('')}
let recordEdit=null;
function editableRecord(type,id){return type==='task'?db.tasks.find(x=>x.id===id):type==='customer'?db.companies.find(x=>x.id===id):type==='meeting'?db.meetings.find(x=>x.id===id):db.activities.find(x=>x.id===id)}
function canEditActivity(a){return a&&!a.workflowKey&&!a.id.startsWith('life-')&&['メモ','資料','コール','商談記録'].includes(a.type)}
function recordEditButton(type,id){return `<button class="icon-edit" data-action="edit-record:${type}/${id}" aria-label="${{task:'タスク',customer:'顧客',meeting:'ミーティング',activity:'活動'}[type]}を編集" title="編集">${icon('pencil')}</button>`}
function recordEditFields(type){return type==='task'?[['title','タスク名'],['owner','担当','owner'],['due','期日'],['description','対応内容','textarea']]:type==='customer'?[['name','会社名'],['person','窓口'],['email','メール','email'],['industry','業種'],['owner','担当','owner']]:type==='meeting'?[['name','ミーティング名'],['date','日時'],['owner','担当','owner'],['participants','参加者'],['agenda','議題','textarea']]:[['title','タイトル'],['date','日時'],['body','内容','textarea']]}
function recordEditor(type,id){const r=editableRecord(type,id);return heading((r.title||r.name)+'を編集')+card('基本情報',`<form id="record-edit-form" data-record="${type}/${id}" class="pad">${recordEditFields(type).map(([key,label,kind])=>`<div class="field"><label for="record-${key}">${label}</label>${kind==='textarea'?`<textarea id="record-${key}">${e(r[key]||'')}</textarea>`:kind==='owner'?`<select id="record-${key}">${['Wada','Ikeda','Sato','Tanaka','Kobayashi'].map(owner=>`<option ${r[key]===owner?'selected':''}>${owner}</option>`).join('')}</select>`:`<input id="record-${key}" ${key==='title'||key==='name'?'required':''} type="${kind==='email'?'email':'text'}" value="${e(r[key]||'')}">`}</div>`).join('')}<div class="actions">${btn('キャンセル','cancel-record-edit')}<button class="btn primary" type="submit">保存</button></div></form>`)}
function customerPage(id){if(recordEdit==='customer/'+id)return recordEditor('customer',id);const c=company(id),ds=db.deals.filter(d=>d.company===id),acts=db.activities.filter(a=>a.company===id).sort((a,b)=>b.date.localeCompare(a.date));return crumb('顧客','customers',c.name)+heading(c.name,'',recordEditButton('customer',id))+props([['窓口',e(c.person)],['メール',e(c.email)],['業種',e(c.industry)],['担当',assignee(c.owner||'Wada')]])+card('案件一覧',`<div class="table-wrap"><table><thead><tr><th>案件名</th><th>ステージ</th><th>担当</th><th>受注予定日</th></tr></thead><tbody>${ds.map(d=>`<tr><td>${link(d.name,'deal/'+d.id)}</td><td>${badge(d.stage)}</td><td>${assignee(d.owner)}</td><td>${dueLabel(d.close)}</td></tr>`).join('')||'<tr><td colspan="4">案件はありません</td></tr>'}</tbody></table></div>`)+`<h2 class="section-gap">活動履歴</h2>`+renderActivityEntries(acts.map(activityEntry).concat(ds.flatMap(d=>recordMeetingEntries(d.id))),true)}
function dealPage(id,tab='activities'){const d=deal(id),c=company(d.company),p=db.proposal;const actions=[['email','メール'],['call','コール'],['meeting','ミーティング'],['memo','メモ'],['document','資料']];const prop=editing?`<form id="deal-properties" data-deal="${id}"><div class="field"><label for="prop-name">案件名</label><input id="prop-name" required value="${e(d.name)}"></div><div class="field"><label for="prop-stage">ステージ</label><select id="prop-stage">${['ヒアリング','提案中','受注'].map(x=>`<option ${x===d.stage?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="prop-amount">案件金額（円）</label><input id="prop-amount" type="number" min="0" required value="${d.amount}"></div><div class="field"><label for="prop-close">受注予定日</label><input id="prop-close" type="date" required value="${d.close}"></div><div class="actions">${btn('戻る','cancel-edit')}<button class="btn primary" type="submit">保存</button></div></form>`:`<dl class="record-props"><dt>ステージ</dt><dd>${badge(d.stage)}</dd><dt>案件金額</dt><dd>${yen(d.amount)}</dd><dt>受注予定日</dt><dd>${e(d.close)}</dd><dt>担当</dt><dd>${assignee(d.owner||'Wada')}</dd></dl>`;const proposal='';let content;if(tab==='tasks'){activityKind='タスク';content=dealTimeline(d)}else if(tab==='workflow')content=workflowChooser(d);else if(tab==='update')content=proposalAction(d);else if(tab==='task'||actions.some(([a])=>a===tab))content=composeForm(d,tab);else if(tab==='overview')content=card('未完了のタスク',db.tasks.filter(t=>t.dealId===d.id&&t.status!=='done').map(t=>`<div class="listline row between"><span>${e(t.title)}</span><button class="btn primary" data-action="open-task:${t.id}">対応する</button></div>`).join('')||'<div class="pad muted">未完了のタスクはありません</div>')+dealOverview(d);else content=dealTimeline(d);return (contextTask(id)?businessCrumb(d,contextTask(id).title,taskDestination(contextTask(id)),tab==='update'):crumb('案件','deals',d.name))+heading(contextTask(id)?.title||d.name)+`<div class="record-grid"><aside class="record-summary">${card('案件情報',`<div class="pad">${prop}</div>`,editing?'':'<button class="btn small icon-edit" data-action="edit" aria-label="案件情報を編集"><svg aria-hidden="true" class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /> <path d="m15 5 4 4" /> </svg></button>')}${card('顧客',`<div class="listline">${link(c.name,'customer/'+c.id)}</div>`)}${card('担当窓口',`<div class="listline"><b>${e(c.person)}</b><div class="small muted email-address">${e(c.email)}</div></div>`)}</aside><section class="record-main"><div class="tabs record-top-tabs"><button class="${tab==='overview'?'active':''}" data-go="deal/${id}/overview">概要</button><button class="${tab!=='overview'?'active':''}" data-go="deal/${id}/activities">活動</button></div>${content}</section></div>`}

function dealTimeline(d){const meetings=db.meetings.filter(m=>m.deal===d.id&&!m.completedAt&&m.date>='2026-10-26'),tasks=db.tasks.filter(t=>t.dealId===d.id&&t.status!=='done');const actions=tasks.length?`<section class="next-action-region"><h2>次のアクション</h2><div class="next-action-items">${tasks.map(t=>`<div class="listline row between next-task-card"><div><b>${e(t.id==='t50'?'商談準備':t.title)}</b><div class="small muted">${assignee(t.owner||'Wada')} · ${dueLabel(t.due)}</div></div><button class="btn primary" data-action="open-task:${t.id}">対応する</button></div>`).join('')}</div></section>`:'';const history=db.activities.filter(a=>a.dealId===d.id);if(activityKind==='タスク')return `<h2>活動履歴</h2>${activityTools()}`+card('タスク',db.tasks.filter(t=>t.dealId===d.id&&(!activityQuery||t.title.includes(activityQuery))).map(t=>`<button class="task-in-deal" data-action="open-task:${t.id}"><span>${e(t.title)}</span>${badge(t.status==='done'?'Done':t.status==='running'?'Doing':'ToDo')}</button>`).join('')||'<div class="pad muted">タスクはありません</div>');return actions+`<h2>活動履歴</h2>${activityTools()}`+renderActivityEntries(history.map(a=>({to:'activity/'+a.id,at:a.date,title:a.title,kind:a.type,actor:a.actor||(a.type==='受信メール'?company(a.company).person:'Wada'),body:`<div class="small muted">${e(a.type)}</div><p class="prose">${e(a.body)}</p><div class="actions">${relatedItem(a.title,'activity/'+a.id,a.type)}</div>`})).concat(recordTaskEntries(d.id),recordMeetingEntries(d.id)))}

function proposalAction(d){const p=db.proposal;return card('受注予定日の変更を確認',`<div class="pad"><p>顧客のメールをもとにした変更案です。</p><div class="diff"><div><small>現在</small>${e(d.close)}</div><span>→</span><div><small>変更案</small>${p.after}</div></div>${sources(['a2'])}${p.status==='pending'?`<div class="actions">${btn('採用しない','reject-update')}${btn('更新する','accept-update',true)}</div>`:badge(p.status==='accepted'?'更新済み':'不採用')}</div>`)}
function composeForm(d,type){const names={memo:'メモを残す',email:'メールを書く',call:'コールを記録',document:'資料を登録',task:'タスクを作る',meeting:'ミーティングを登録'};return card(names[type],`<form id="compose-form" data-deal="${d.id}" data-kind="${type}" class="pad">${type==='email'?`<div class="small muted" style="margin-bottom:18px">宛先：${e(company(d.company).person)} &lt;${e(company(d.company).email)}&gt;</div>`:''}<div class="field"><label for="compose-title">${type==='email'?'件名':'タイトル'}</label><input id="compose-title" required></div>${['memo','email','call','document'].includes(type)?`<div class="field"><label for="compose-body">内容</label><textarea id="compose-body" ${type==='call'?'':'required'}></textarea></div>`:''}${type==='document'?'<div class="field"><label for="compose-url">資料URL</label><input id="compose-url" type="url" placeholder="https://example.com/document"></div>':''}${['task','meeting'].includes(type)?`<div class="field"><label for="compose-date">${type==='task'?'期限':'日時'}</label><input id="compose-date" type="${type==='task'?'date':'datetime-local'}" required value="${type==='task'?'2026-10-27':'2026-10-27T14:00'}"></div>`:''}<div class="actions"><button class="btn" type="button" data-go="deal/${d.id}/activities">キャンセル</button><button class="btn primary" type="submit">${type==='email'?'下書きを保存':'保存'}</button></div></form>`)}


function recordTaskEntries(dealId){return db.tasks.filter(t=>t.dealId===dealId&&t.status==='done'&&t.completedAt).map(t=>({at:t.completedAt,title:t.title,kind:'タスク',status:'完了',actor:t.owner||'Wada',to:taskDestination(t),body:`<p class="small">${e(t.note||'対応を完了しました。')}</p>`}))}

function recordMeetingEntries(dealId){return db.meetings.filter(m=>m.deal===dealId&&!db.activities.some(a=>a.meeting===m.id&&a.type==='商談記録')).map(m=>({to:'meeting/'+m.id+'/brief',at:m.completedAt||m.date,title:m.name,kind:'ミーティング',status:m.completedAt?'実施済み':'予定',actor:m.owner||deal(dealId).owner,body:`<div class="small muted">${e(company(deal(dealId).company).name)} · ${e(deal(dealId).name)}</div><p>${e(m.agenda||m.name)}</p>`}))}
function activityEntry(a){return {to:'activity/'+a.id,at:a.date,title:a.title,kind:a.type,actor:a.actor||(a.type==='受信メール'?company(a.company).person:'Wada'),body:`<div class="small muted">${a.dealId?e(deal(a.dealId).name):'顧客に関する活動'}</div><p class="prose">${e(a.body)}</p>`}}
function activityTools(){const d=route.startsWith('deal/')?route.split('/')[1]:null,all=[['メール','email'],['コール','call'],['ミーティング','meeting'],['メモ','memo'],['資料','document'],['タスク','task']],types=activityKind==='コミュニケーション'?all.slice(0,3):activityKind==='メモ'?all.slice(3,5):all;return `<div class="activity-toolbar"><div class="tabs activity-segments">${['すべて','コミュニケーション','メモ','タスク'].map((label,i)=>`<button data-action="activity-kind:${i===0?'all':label}" class="${activityKind===(i===0?'all':label)?'active':''}">${label}</button>`).join('')}</div>${d?activityKind==='タスク'?`<button class="btn small" data-go="deal/${d}/task">${icon('plus')} タスクを追加</button>`:`<details class="add-menu"><summary class="btn small">${icon('plus')} 追加</summary><div>${types.map(([label,key])=>`<button data-go="deal/${d}/${key}">${label}</button>`).join('')}</div></details>`:''}</div>`}
function activityGroup(x){const type=activityCategory(x);return ['メール','コール','ミーティング'].includes(type)?'コミュニケーション':type==='タスク'?'タスク':'メモ'}
function activityCategory(x){if(['タスク','ミーティング','メモ','資料','コール'].includes(x.kind))return x.kind;const text=(x.kind||'')+' '+x.title;if(text.includes('メール'))return 'メール';if(text.includes('資料'))return '資料';if(text.includes('タスク'))return 'タスク';if(text.includes('コール')||text.includes('電話'))return 'コール';if(text.includes('商談')||text.includes('ミーティング')||text.includes('ヒアリング'))return 'ミーティング';return 'メモ'}

function activityMatches(text){return (!activityQuery||text.toLowerCase().includes(activityQuery.toLowerCase()))&&(activityKind==='all'||text.includes(activityKind))}
function renderActivityEntries(entries,unfiltered=false){let day='';return entries.filter(x=>unfiltered||(!activityQuery||(x.title+' '+(x.search||x.body.replace(/<[^>]*>/g,''))).toLowerCase().includes(activityQuery.toLowerCase()))&&(activityKind==='all'||activityGroup(x)===activityKind)).sort((a,b)=>b.at.replace('T',' ').localeCompare(a.at.replace('T',' '))).map(x=>{const date=x.at.slice(0,10),group=day!==date?`<h3 class="activity-date">${e(date)}</h3>`:'';day=date;const match=x.body.match(/data-go="([^"]+)"/),to=x.to||match?.[1],body=x.body.replace(/<div class="actions">[\s\S]*?<\/div>/g,'').replace(/<button[^>]*data-go="[^"]+"[^>]*>[\s\S]*?<\/button>/g,'');return group+`<article class="activity-card ${to?'record-clickable':''}" ${to?`role="link" tabindex="0" data-record-go="${to}"`:''}><header><div class="row">${assignee(x.actor)}<span class="muted small">${e(x.at.slice(11))}</span></div>${x.status?badge(x.status):badge(x.kind||activityCategory(x))}<h3>${e(x.title)}</h3></header><div class="pad">${body}</div></article>`}).join('')||'<div class="card pad muted">該当する活動はありません</div>'}
function meetingPage(id,tab){if(recordEdit==='meeting/'+id)return recordEditor('meeting',id);const m=meeting(id);if(!m)return heading('ミーティングが見つかりません');const d=deal(m.deal),c=company(d.company);if(tab==='mail'){const mail=db.mails[id];return businessCrumb(d,mail?.subject||'メール案','meeting/'+id+'/mail')+heading(mail?.subject||'メール案')+`<div class="record-layout"><aside>${recordSummary(d)}</aside><section>${mail?card(mail.subject,`<div class="pad prose">${e(mail.body)}</div>`):card('メール案','<div class="pad muted">メール案はまだありません</div>')}${mailHistory(d.id)}</section></div>`}if(!['action','document','mail'].includes(tab)){return businessCrumb(d,m.name,'meeting/'+id+'/brief')+heading(m.name,'',recordEditButton('meeting',id))+`<div class="record-layout"><aside>${recordSummary(d)}</aside><section>${props([['日時',m.date],['担当',assignee(m.owner||d.owner)],['参加者',e(m.participants||'未登録')],['状態',badge(m.completedAt?'実施済み':'予定')]])}${card('議題',`<div class="pad prose">${e(m.agenda||m.name)}</div>`)}${nextAction(m)}${card('ミーティング記録',editing?`<form id="meeting-note-form" data-meeting="${id}" class="pad"><div class="field"><label for="meeting-notes">記録</label><textarea id="meeting-notes">${e(m.notes||'')}</textarea></div><div class="field"><label for="next-task">次の対応</label><input id="next-task"></div><button class="btn primary" type="submit">記録を保存</button></form>`:`<div class="pad prose">${e(m.notes||'記録はまだありません')}</div>`,editing?'':'<button class="btn small" data-action="edit">記録を追加・編集</button>')}</section></div>`}const summary=card('基本情報',`<dl class="record-props pad"><dt>日時</dt><dd>${e(m.date)}</dd><dt>担当</dt><dd>${assignee(m.owner||d.owner)}</dd><dt>顧客</dt><dd>${link(c.name,'customer/'+c.id)}</dd><dt>案件</dt><dd>${link(d.name,'deal/'+d.id)}</dd><dt>状態</dt><dd>${badge(phaseLabel(m.phase))}</dd></dl>`);const workTitle=m.phase==='mail-review'||m.phase==='complete'?'事前確認メール':'商談準備';const action=card(workTitle,`<div class="pad">${['brief-review','prepared'].includes(m.phase)?briefArtifact(m):m.phase==='mail-review'?mailArtifact(m):['preparing','drafting'].includes(m.phase)?`<div class="notice"><b>${e(company(d.company).name)}の${m.phase==='preparing'?'商談準備資料':'事前確認メール'}を作成中</b><p class="small muted section-gap">対象：${e(m.name)}。この案件の顧客情報と活動記録を参照しています。</p></div>${btn('デモ：作成を完了','lifecycle-tick:'+id,true)}`:m.phase==='complete'?mailArtifact(m):`<p><b>${e(c.name)} / ${e(d.name)}</b>の商談に向けて、確認事項と準備資料を作成します。</p><dl class="record-props section-gap"><dt>対象の商談</dt><dd>${e(m.name)} · ${e(m.date)}</dd><dt>参照する情報</dt><dd>この案件の顧客情報・過去の活動記録</dd><dt>作成後</dt><dd>同じ商談に資料を保存し、内容の確認へ進みます。</dd></dl><div class="actions">${btn('この商談の準備資料を作成','start-preparation:'+m.id,true)}</div>`}</div>`);return businessCrumb(d,tab==='action'?workTitle:m.name,'meeting/'+id+'/brief',tab==='action'||tab==='document')+heading(contextTask(d.id)?.title||(tab==='action'?workTitle+' / '+c.name:m.name),tab==='action'?d.name+' · '+m.name:'')+`<div class="record-layout"><aside>${recordSummary(d)}</aside><section>${props([['日時',m.date],['担当',assignee(m.owner||d.owner)],['状態',badge(phaseLabel(m.phase))]])}${tab==='document'?card('準備資料',`<div class="pad">${briefArtifact(m)}</div>`):tab==='action'?action:nextAction(m)}<h2>活動履歴</h2>${activityTools()}${meetingCards(m,tab==='action')}${tab==='action'?'':card('商談記録',`<form id="meeting-note-form" data-meeting="${id}" class="pad"><div class="field"><label for="meeting-notes">決まったこと・確認したこと</label><textarea id="meeting-notes">${e(m.notes)}</textarea></div><div class="field"><label for="next-task">次の対応</label><input id="next-task" placeholder="次のタスク"></div><div class="actions"><button class="btn" type="submit">記録を保存</button></div></form>`)}</section></div>`}

function artifactPreview(m,kind){const mail=db.mails[m.id],title=kind==='mail'?(mail?.subject||'メール案'):'商談準備資料',body=kind==='mail'?(mail?.body||''):m.brief;return `<b>${e(title)}</b><p class="activity-preview">${e(body.slice(0,150))}${body.length>150?'…':''}</p><button class="link" data-go="meeting/${m.id}/${kind==='mail'?'action':'document'}">${e(title)}</button>`}
function meetingCards(m,readOnly=false){const c=company(deal(m.deal).company),mail=db.mails[m.id];let entries=db.activities.filter(a=>a.dealId===m.deal&&!a.meeting&&a.type!=='活動記録').map(a=>({at:a.date,title:a.title,kind:a.type,actor:a.type==='受信メール'?c.person:(a.actor||'Wada'),body:`<div class="small muted">${e(a.type)}</div><p class="prose" style="margin-top:8px">${e(a.body)}</p><div class="actions">${relatedItem(a.title,'activity/'+a.id,a.type)}</div>`}));const events=m.events||[];let hasBrief=false,hasMail=false;for(const ev of events){let content=ev.body?`<p>${e(ev.body)}</p>`:'';if(ev.id.includes('-prepared')){hasBrief=true;content=ev.id.includes('-'+m.revision+'-')?(artifactPreview(m,'brief')):`<div class="prose">${e(ev.artifact||'資料を保存しました。')}</div>`}if(ev.id.includes('-drafted')){hasMail=true;content=artifactPreview(m,'mail')}entries.push({to:'activity/'+ev.id,at:ev.at||'2026-10-26 09:00',title:ev.title,actor:ev.actor,body:content})}if(m.prepared&&!hasBrief)entries.push({at:'2026-10-26 06:00',title:'準備資料を作成',actor:'AI',body:artifactPreview(m,'brief')});if(mail&&!hasMail)entries.push({at:'2026-10-26 06:05',title:'メール下書きを作成',actor:'AI',body:artifactPreview(m,'mail')});return renderActivityEntries(entries.concat(recordTaskEntries(m.deal)))}
function briefArtifact(m){const review=['brief-review','prepared'].includes(m.phase);return `${badge(m.reviewed?'確認済み':'確認待ち',m.reviewed?'green':'amber')}<div class="section-gap">${editing?`<textarea id="brief-edit" style="min-height:280px">${e(m.brief)}</textarea><div class="actions">${btn('キャンセル','cancel-edit')}${btn('資料を保存','save-brief:'+m.id,true)}</div>`:`<div class="prose">${e(m.brief)}</div>${sources(m.sourceIds||[])}<div class="actions">${btn('編集する','edit')}</div>`}</div>${review?`<div class="artifact-actions"><div class="field"><label for="revision-request">修正してほしいこと</label><textarea id="revision-request" style="min-height:90px" placeholder="例：予算の確認を追加して"></textarea></div><div class="row">${btn('AIに修正を依頼','request-revision:'+m.id)}${btn('確認して次へ','approve-brief:'+m.id,true)}</div></div>`:''}`}
function mailArtifact(m){const mail=db.mails[m.id];if(!mail)return '';const c=company(deal(m.deal).company);return `${badge(mail.status==='sent'?'送信済み':'下書き',mail.status==='sent'?'green':'')}<p class="small muted" style="margin:12px 0">宛先：${e(c.person)} &lt;${e(c.email)}&gt;</p>${(mail.status==='sent'||mail.reviewReady)?`<h3>${e(mail.subject)}</h3><div class="prose section-gap">${e(mail.body)}</div>`:`<div class="mail-fields"><div class="field"><label class="small" for="meeting-mail-title">件名</label><input id="meeting-mail-title" value="${e(mail.subject)}"></div><div class="field"><label class="small" for="meeting-mail-body">本文</label><textarea id="meeting-mail-body">${e(mail.body)}</textarea></div></div>`}<div class="mail-evidence">${sources(mail.sourceIds||[])}</div>${mail.status==='draft'?`<div class="actions">${mail.reviewReady?`${btn('編集に戻る','lifecycle-edit-mail:'+m.id)}${btn('送信する（デモ）','lifecycle-send:'+m.id,true)}`:`${btn('下書きを保存','lifecycle-save-mail:'+m.id)}${m.phase==='mail-review'?btn('送信内容を確認','lifecycle-review-mail:'+m.id,true):''}`}</div>`:''}`}
function phaseLabel(p){return ({'not-started':'未着手',prepared:'資料保存済み',preparing:'準備資料を作成中','brief-review':'資料の確認待ち',drafting:'メール案を作成中','mail-review':'送信の確認待ち',complete:'完了'})[p]||'未着手'}
function nextAction(m){const tasks=db.tasks.filter(t=>(t.meetingId===m.id||t.route.startsWith('meeting/'+m.id+'/'))&&t.status!=='done');return tasks.length?`<section class="next-action-region"><h2>次のアクション</h2><div class="next-action-items">${tasks.map(t=>`<div class="listline row between next-task-card"><b>${e(t.title)}</b><button class="btn primary" data-action="open-task:${t.id}">対応する</button></div>`).join('')}</div></section>`:''}


function activityPage(id){if(recordEdit==='activity/'+id)return recordEditor('activity',id);const a=db.activities.find(a=>a.id===id);if(!a)return heading('活動が見つかりません');const c=company(a.company),d=a.dealId?deal(a.dealId):null;const draft=a.type==='メール下書き';return (d?businessCrumb(d,a.title,'activity/'+id):crumb(c.name,'customer/'+c.id,a.title))+heading(a.title,'',canEditActivity(a)?recordEditButton('activity',id):'')+`<div class="record-layout"><aside>${d?recordSummary(d):card('顧客',`<div class="pad">${link(c.name,'customer/'+c.id)}</div>`)}</aside><section>`+props([['日時',a.date],['種類',a.type],['担当',assignee(a.actor||d?.owner||'Wada')],...(a.type==='コール'?[['相手',e(a.person||c.person)]]:[])])+`${card(a.type,a.type==='コール'&&editing?`<form id="call-record-form" data-activity="${id}" class="pad"><div class="field"><label for="call-record-body">記録</label><textarea id="call-record-body">${e(a.body||'')}</textarea></div><div class="actions">${btn('キャンセル','cancel-edit')}<button class="btn primary" type="submit">記録を保存</button></div></form>`:draft?`<form id="draft-form" data-activity="${id}" class="pad"><div class="small muted" style="margin-bottom:18px">宛先：${e(c.email)}</div><div class="field"><label for="draft-title">件名</label><input id="draft-title" required ${a.reviewReady?'readonly':''} value="${e(a.title)}"></div><div class="field"><label for="draft-body">本文</label><textarea id="draft-body" required ${a.reviewReady?'readonly':''}>${e(a.body)}</textarea></div><div class="actions"><button class="btn" type="submit" name="mode" value="save">下書きを保存</button>${a.reviewReady?'<button class="btn" type="submit" name="mode" value="edit">編集に戻る</button><button class="btn primary" type="submit" name="mode" value="send">送信する（デモ）</button>':'<button class="btn primary" type="submit" name="mode" value="review">送信内容を確認</button>'}</div></form>`:`<div class="pad">${a.meeting?`<div class="small muted" style="margin-bottom:18px">関連する打ち合わせ：${relatedItem(meeting(a.meeting).name,'meeting/'+a.meeting+'/mail','打ち合わせ')}</div>`:''}<div class="prose">${e(a.body||'記録はまだありません')}</div>${a.documentUrl&&/^https?:\/\//.test(a.documentUrl)?`<p class="section-gap"><a class="related-chip" href="${e(a.documentUrl)}" target="_blank" rel="noopener noreferrer">${icon('file-text')} ${e(a.title)}</a></p>`:''}${sources(a.sourceIds||[])}${a.taskId&&db.tasks.some(t=>t.id===a.taskId)?`<div class="actions"><button class="btn primary" data-action="open-task:${a.taskId}">${db.tasks.find(t=>t.id===a.taskId).status==='done'?'完了したタスクを開く':'確認・対応するタスクを開く'}</button></div>`:''}${a.workflowKey?`<div class="actions">${db.tasks.find(t=>t.workflowKey===a.workflowKey)?.status==='done'?badge('確認済み','green'):btn('内容を確認済みにする','approve-workflow:'+db.workflowRuns[a.workflowKey].task,true)}</div>`:''}</div>`,a.type==='コール'&&!editing?'<button class="btn small" data-action="edit">記録を追加・編集</button>':'')}${a.type.includes('メール')&&d?mailHistory(d.id,a.id):''}</section></div>`}
function taskMeeting(t){return t.meetingId?meeting(t.meetingId):t.route.startsWith('meeting/')?meeting(t.route.split('/')[1]):null}
function legacyTaskWork(t){if(workflowPickerTask===t.id)return workflowChooser(deal(t.dealId),'f1',t);const m=taskMeeting(t);if(m){let content;if(['not-started',undefined].includes(m.phase))content=`<p>${e(company(t.company).name)}の${e(m.name)}に向けて準備資料を作成し、内容を確認します。</p><div class="actions">${btn('AIで準備資料を作成','start-preparation:'+m.id,true)}</div>`;else if(['preparing','drafting'].includes(m.phase))content=`<p>${m.phase==='preparing'?'準備資料':'メール下書き'}を作成しています。</p><div class="actions">${btn('デモ：処理を完了','lifecycle-tick:'+m.id,true)}</div>`;else if((t.kind.includes('準備')&&t.id!=='t50')||['brief-review','prepared'].includes(m.phase))content=briefArtifact(m);else content=mailArtifact(m);return card((t.kind.includes('準備')&&t.id!=='t50')?'準備資料':['mail-review','complete','drafting'].includes(m.phase)?'メールを作成':'準備資料',`<div class="pad">${content}</div>`)+(['mail-review','complete'].includes(m.phase)?mailHistory(m.deal,'sent-'+m.id):'')}if(t.workflowKey){const run=db.workflowRuns[t.workflowKey],a=db.activities.find(a=>a.id===run.activity);return card(a.type==='メール下書き'?'メールを作成':'資料',`<div class="pad"><h3>${e(a.title)}</h3><div class="prose section-gap">${e(a.body)}</div>${sources(a.sourceIds||[])}<div class="actions">${a.type==='メール下書き'?`<button class="btn primary" data-go="activity/${a.id}">${e(a.title)}</button>`:t.status==='done'?badge('確認済み','green'):btn('内容を確認済みにする','approve-workflow:'+t.id,true)}</div></div>`)}return card('対応内容',`<div class="pad"><p>${e(t.description||t.title)}</p><h3 class="section-gap">背景</h3><p class="section-gap">${e(t.reason||'案件の次の対応として登録されたタスクです。')}</p></div>`)+card('対応結果',`<div class="pad"><div class="field"><label for="task-note">記録</label><textarea id="task-note">${e(t.note||'')}</textarea></div><div class="actions">${btn('記録を保存','save-task:'+t.id)}${t.status!=='done'?btn('完了にする','complete-task:'+t.id,true):''}</div></div>`)}
function taskRelatedHistory(t){const m=taskMeeting(t),a=t.workflowKey?db.activities.find(a=>a.id===db.workflowRuns[t.workflowKey]?.activity):null;const references=[...(m?.prepared?[{label:'商談準備資料 — '+m.name,to:'meeting/'+m.id+'/document',type:'資料'}]:[]),...(m&&db.mails[m.id]?[{label:db.mails[m.id].subject,to:'meeting/'+m.id+'/mail',type:'メール'}]:[]),...(a?[{label:a.title,to:'activity/'+a.id,type:a.type}]:[])];return references.length?card('関連する活動履歴',`<div class="pad related-items">${references.map(r=>relatedItem(r.label,r.to,r.type)).join('')}</div>`):''}
function taskWork(t){if(workflowPickerTask===t.id)return workflowChooser(deal(t.dealId),'f1',t);const m=taskMeeting(t);return card('対応内容',`<div class="pad"><p>${e(t.description||t.title)}</p>${t.reason?`<p class="small muted section-gap">${e(t.reason)}</p>`:''}</div>`)+card('対応記録',`<div class="pad"><label class="visually-hidden" for="task-note">任意の記録</label><textarea id="task-note" placeholder="必要なことがあれば記録">${e(t.note||'')}</textarea><div class="actions">${btn('記録を保存','save-task:'+t.id)}</div></div>`)+(m&&!m.prepared?`<details class="card pad"><summary>準備資料の作成補助</summary><div class="section-gap">${legacyTaskWork(t)}</div></details>`:'')}
function recurringTargets(){const cutoff='2026-08-26';return db.companies.map(c=>{const last=db.activities.filter(a=>a.company===c.id&&['受信メール','送信メール','商談記録','コール'].includes(a.type)).sort((a,b)=>b.date.localeCompare(a.date))[0];return {c,last,task:db.tasks.find(t=>t.recurringKey==='r-followup:'+c.id&&t.status!=='done')}}).filter(x=>x.last&&x.last.date.slice(0,10)<=cutoff)}
function recurringPage(){const rows=recurringTargets();return crumb('業務フロー','flows',db.recurring.name)+heading(db.recurring.name,'定期実行')+props([['予定',db.recurring.schedule],['条件','2か月以上連絡していない顧客'],['実行方式','ローカルデモ（自動実行なし）']])+card('処理',`<div class="pad"><p>最後の連絡記録を確認し、担当者の確認タスクを作成します。</p><div class="actions">${btn('今すぐ実行','recurring-preview',true)}</div></div>`)+(recurringPreview?card('対象の確認',rows.length?`<div class="table-wrap"><table><thead><tr><th>顧客</th><th>最終連絡</th><th>状態</th></tr></thead><tbody>${rows.map(({c,last,task})=>`<tr><td>${link(c.name,'customer/'+c.id)}</td><td>${e(last.date)}</td><td>${task?link('作成済みのタスク','task/'+task.id):'作成対象'}</td></tr>`).join('')}</tbody></table></div><div class="pad">${rows.some(r=>!r.task)?btn('確認タスクを作成','recurring-create',true):'<p>対象の確認タスクはすべて作成済みです。</p>'}</div>`:'<div class="pad muted">条件に合う顧客はいません。</div>'):'')}
function taskPage(id){if(recordEdit==='task/'+id)return recordEditor('task',id);const t=db.tasks.find(t=>t.id===id),d=deal(t.dealId),m=taskMeeting(t);return `<div class="crumb">${link('案件','deals')}<svg aria-hidden="true" class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="m9 18 6-6-6-6" /> </svg>${link(d.name,'deal/'+d.id+'/activities')}<svg aria-hidden="true" class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="m9 18 6-6-6-6" /> </svg>${link('タスク','deal/'+d.id+'/tasks')}<svg aria-hidden="true" class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="m9 18 6-6-6-6" /> </svg>${e(t.title)}</div>`+heading(t.title,'',recordEditButton('task',id))+`<div class="record-layout"><aside>${recordSummary(d)}${taskRelatedHistory(t)}</aside><section><div class="task-metadata">${props([['担当',assignee(t.owner||'Wada')],['期日',dueLabel(t.due)],['状態',`<label class="visually-hidden" for="task-status">タスクの状態</label><select id="task-status" data-task="${t.id}">${[['open','ToDo'],['running','Doing'],['done','Done']].map(([value,label])=>`<option value="${value}" ${t.status===value?'selected':''}>${label}</option>`).join('')}</select>`]])}</div>${taskWork(t)}</section></div>`}

function flowsPage(){return heading('業務フロー')+card('定期実行',`<button class="listline row between flow-list-row" data-go="flow/f4"><div><h3>${e(db.recurring.name)}</h3><div class="small muted">毎週月曜日 · 確認タスクの作成</div></div></button>`)+card('手動実行',workflowTemplates.map(f=>`<button class="listline row between flow-list-row" data-go="flow/${f.id}"><div><h3>${e(f.name)}</h3><div class="small muted">手動実行 · ${e(f.output)}の作成補助</div></div></button>`).join(''))}

document.addEventListener('click',ev=>{const el=ev.target.closest('button,a[data-go]');if(!el)return;if(el.dataset.go){ev.preventDefault?.();go(el.dataset.go);return}if(el.dataset.taskScope){taskScope=el.dataset.taskScope;render();return}if(el.dataset.filter){filter=el.dataset.filter;render();return}const [a,id]=(el.dataset.action||'').split(':');if(!a)return;if(handleLifecycleAction(a,id))return;switch(a){case'edit-record':{const [type,rid]=id.split('/');if(type==='activity'&&!canEditActivity(editableRecord(type,rid)))return;recordEdit=id;break}case'cancel-record-edit':recordEdit=null;break;case'clear-search':search='';dealStage='all';dealOwner='all';break;case'view-kanban':dealView='kanban';break;case'view-list':dealView='list';break;case'edit':editing=true;break;case'cancel-edit':editing=false;break;case'save-brief':meeting(id).brief=$('#brief-edit').value;editing=false;toast('準備資料を保存しました');break;case'review-brief':meeting(id).reviewed=true;db.tasks.filter(t=>t.route==='meeting/'+id+'/brief').forEach(t=>t.status='done');toast('確認済みにしました');break;case'save-mail':activeMail().subject=$('#mail-subject').value;activeMail().body=$('#mail-body').value;editing=false;toast('下書きを保存しました');break;case'send-mail':{const mid=route.split('/')[1],mail=activeMail();if(!mail||mail.status!=='draft')break;mail.status='sent';const aid='sent-'+mid;db.activities.unshift({id:aid,company:deal(meeting(mid).deal).company,dealId:meeting(mid).deal,meeting:mid,title:mail.subject,date:'2026-10-26 09:00',type:'送信メール',body:mail.body});if(mid==='m1')complete('t1');toast('デモ内で送信済みにしました（実際の送信はありません）');break;}case'accept-update':deal('d1').close=db.proposal.after;db.proposal.status='accepted';complete('t2');toast('受注予定日を更新しました');break;case'reject-update':db.proposal.status='rejected';complete('t2');toast('更新案を採用しませんでした');break;case'prepare':prepare(id);toast('商談に準備資料を保存しました');break;case'save-notes':{const m=meeting(id);m.notes=$('#meeting-notes').value;const title=$('#next-task').value.trim();if(titl function lifecycleTask(m,kind,state){if(m.taskOwnerId){const t=db.tasks.find(t=>t.id===m.taskOwnerId);if(state==='done')t.completedAt||='2026-10-26 10:30';Object.assign(t,{status:state,executionMode:['prepare','draft'].includes(kind)?'ai':'collaborative'});return t}const d=deal(m.deal),id=kind==='prepare'&&m.id==='m2'?'t50':kind==='mail-review'&&m.id==='m1'?'t1':kind+'-'+m.id;let t=db.tasks.find(t=>t.id===id);const isReview=kind==='review'||kind==='mail-review',title={prepare:'商談準備',review:'準備資料の確認',draft:'事前確認メールの作成','mail-review':'メール送信の確認'}[kind];if(!t){t={id,company:d.company,dealId:d.id,due:'10/27',meetingId:m.id,parentExecution:m.executionId,route:'meeting/'+m.id+'/brief'};db.tasks.push(t)}Object.assign(t,{title:company(d.company).name+' / '+title,kind:title,status:state,owner:isReview?(m.owner||'Wada'):'AI',executionMode:isReview?'collaborative':'ai',needsHuman:isReview&&state==='open'});return t;}
function tickMeeting(m){if(m.taskRun&&db.workflowRuns[m.taskRun])db.workflowRuns[m.taskRun].status='review';if(m.phase==='preparing'){prepare(m.id);delete db.mails[m.id];m.phase=db.flow.policy==='save'?'prepared':'brief-review';m.reviewed=false;if(m.revisionRequest)m.brief+='\n\n追加の確認事項\n'+m.revisionRequest;logMeeting(m,'prepared','準備資料を作成','AI');lifecycleTask(m,'prepare','done');if(db.flow.policy!=='save')lifecycleTask(m,'review','open');if(m.id==='m2'){db.run.status='done';db.run.step=4}}else if(m.phase==='drafting'){const c=company(deal(m.deal).company);db.mails[m.id]={subject:m.name+'に向けた事前確認',body:c.person+'様\n\nお世話になっております。\n次回の'+m.name+'では、対象業務、導入時期、ご予算について確認できればと思います。\n関連資料がありましたらご共有ください。\n\nよろしくお願いいたします。',status:'draft',sourceIds:[...(m.sourceIds||[])]};m.phase='mail-review';logMeeting(m,'drafted','メール下書きを作成','AI');lifecycleTask(m,'draft','done');lifecycleTask(m,'mail-review','open')}else return;toast('次の確認タスクを作成しました');render();}
function handleLifecycleAction(a,id){if(homeAction(a,id))return true;if(a==='manual-start'){const candidate=db.deals.find(d=>applicableTasks(id,d.id).length)||db.deals[0];manualFlow={flow:id,deal:candidate.id,task:null};render();return true}if(a==='manual-cancel'){manualFlow=null;render();return true}if(a==='manual-reselect'){manualFlow.task=null;render();return true}if(a==='manual-execute'){const state=manualFlow;if(!state||!applicableTasks(state.flow,state.deal).some(t=>t.id===state.task))return true;const tid=state.task;workflowSelection={flow:state.flow,deal:state.deal,task:tid};executeWorkflow();go('task/'+tid);return true}if(a==='recurring-preview'){recurringPreview=true;render();return true}if(a==='recurring-create'){for(const {c,last,task} of recurringTargets()){if(task)continue;const d=db.deals.find(d=>d.company===c.id);if(!d)continue;const id='followup-'+c.id+'-'+(++entitySequence);db.tasks.push({id,title:c.name+'の状況を確認',description:'最後の連絡内容を確認し、現在の検討状況と次の対応を判断する。',company:c.id,dealId:d.id,owner:c.owner||'Wada',kind:'顧客の確認',status:'open',due:'10/26',recurringKey:'r-followup:'+c.id,sourceIds:[last.id],route:'task/'+id})}render();return true}if(a==='task-flow'){workflowPickerTask=id;workflowSelection=null;render();return true}if(a==='workflow-cancel'){workflowPickerTask=null;workflowSelection=null;render();return true}if(a==='workflow-reselect'){workflowSelection=null;render();return true}if(a==='workflow-execute'){executeWorkflow();return true}if(a==='approve-workflow'){complete(id);render();return true}if(a==='open-task'){taskContextId=id;go(taskDestination(db.tasks.find(t=>t.id===id)));return true}if(a==='activity-kind'){if(route.startsWith('deal/')&&route.endsWith('/tasks'))go('deal/'+route.split('/')[1]+'/activities');activityKind=id;render();return true}if(a==='overview-refresh'){delete overviewState[id];render();return true}if(a==='toggle-assistant'){const ctx=contextRecord();contextDrafts[ctx.key]=$('#context-input').value;assistantOpen=!assistantOpen;const box=document.querySelector('.workbench'),panel=document.querySelector('.context-ai'),toggle=document.querySelector('.assistant-panel-toggle');if(box?.classList){box.classList.toggle('dock-open',assistantOpen);box.classList.toggle('dock-closed',!assistantOpen);panel.classList.toggle('dock-visible',assistantOpen);panel.classList.toggle('dock-hidden',!assistantOpen);panel.inert=!assistantOpen;panel.setAttribute('aria-hidden',String(!assistantOpen));toggle.setAttribute('aria-expanded',String(assistantOpen));toggle.setAttribute('aria-label',assistantOpen?'AIアシスタントを閉じる':'AIアシスタントを開く');toggle.title=assistantOpen?'AIアシスタントを閉じる':'AIアシスタントを開く';}else render();return true;}if(a==='customer-sort'){customerSort.dir=customerSort.key===id?-customerSort.dir:1;customerSort.key=id;render();return true}if(a==='task-owner'){needsMyAction=id==='self';render();return true}if(!['start-preparation','request-revision','approve-brief','lifecycle-tick','lifecycle-save-mail','lifecycle-review-mail','lifecycle-edit-mail','lifecycle-send','sample-run','finish-run','stop-run'].includes(a))return false;const m=meeting(['sample-run','finish-run','stop-run'].includes(a)?db.run.meeting:(id||route.split('/')[1]));if(!m)return true;if(a==='sample-run'){m.phase='not-started';route='meeting/'+m.id+'/brief';return handleLifecycleAction('start-preparation',m.id)}if(a==='finish-run'){tickMeeting(m);return true}if(a==='stop-run'){db.run.status='stopped';m.phase='not-started';lifecycleTask(m,'prepare','open');logMeeting(m,'stopped','実行を停止','Wada');render();return true}if(a==='start-preparation'){if(!['not-started',undefined].includes(m.phase))return true;if(route.startsWith('task/')){const t=db.tasks.find(t=>t.id===route.split('/')[1]);if(t){m.taskOwnerId=t.id;m.taskRun='prepare-'+t.id;db.workflowRuns[m.taskRun]={task:t.id,deal:t.dealId,meeting:m.id,flow:'f1',definitionVersion:db.workflowDefinitions.f1.version,definitionSnapshot:structuredClone(db.workflowDefinitions.f1),status:'running'}}}m.phase='pre function contextAnswer(prompt,ctx){const page=route.split('/')[0],id=route.split('/')[1];if(page==='customer'){const c=company(id),ds=db.deals.filter(d=>d.company===id),ts=db.tasks.filter(t=>t.company===id&&t.status!=='done'),acts=db.activities.filter(a=>a.company===id);return `<p>${e(c.name)}には${ds.length}案件、未完了タスク${ts.length}件、活動${acts.length}件があります。</p>${prompt.includes('タスク')?ts.map(t=>`<p>${link(t.title,taskDestination(t))}</p>`).join(''):prompt.includes('活動')?acts.slice(0,3).map(a=>`<p>${link(a.title,'activity/'+a.id)}</p>`).join(''):ds.map(d=>`<p>${link(d.name,'deal/'+d.id)}</p>`).join('')}`}if(page==='dashboard')return `<p>10月の商談数は${metricRecords('meetings').length}件、受注数は${metricRecords('won').length}件です。目標は商談${db.meetingGoal.count}件・受注${db.wonGoal.count}件・受注金額${yen(db.goal.amount)}です。</p><p>${link('今月の商談一覧','metric/meetings')}</p><p>${link('受注金額の算出条件','metric/amount')}</p>`;if(page==='flows'||page==='flow')return `<p>フローはタスク詳細から実行します。一覧では再利用する業務フローを編集できます。</p>${workflowTemplates.map(f=>`<p>${link(f.name,'flow/'+f.id)}</p>`).join('')}`;if(page==='chat')return `<p>中央の会話では今日のToDo・更新・商談準備を確認できます。この欄では画面の使い方や移動先を案内します。</p><p>${link('案件一覧','deals')}</p><p>${link('タスク一覧','tasks')}</p>`;if(ctx.t){const t=ctx.t,d=ctx.d,records=db.activities.filter(a=>a.dealId===d.id&&!a.workflowKey&&a.type!=='活動記録');if(/過去のメール|商談記録|合意事項|未確認事項|準備に使える|過去の記録|送付前/.test(prompt)){const isMail=prompt.includes('過去のメール'),hits=records.filter(a=>isMail?['受信メール','送信メール'].includes(a.type):prompt.includes('商談記録')?a.type==='商談記録':['商談記録','受信メール','送信メール','メモ','資料'].includes(a.type)).slice(0,3);const intro=prompt.includes('送付前')?'宛先・件名・日時と依頼内容を、次の記録と照らして確認してください。':prompt.includes('未確認')?'次の記録にある依頼事項を確認してください。対応済みかどうかは、この記録だけでは確定できません。':prompt.includes('合意')?'合意・希望の確認に使える記録です。記録にない確定事項は補っていません。':'この案件に紐づく記録です。';return hits.length?`<p>${intro}</p>${hits.map(a=>`<p class="section-gap">${e(a.body)}</p>${sources([a.id])}`).join('')}`:'<p>この案件には、質問に対応する根拠の記録が見つかりませんでした。</p>';}if(prompt.includes('似た')){const similar=db.deals.filter(x=>x.id!==d.id&&company(x.company).industry===company(d.company).industry),hits=db.activities.filter(a=>similar.some(x=>x.id===a.dealId)&&['商談記録','受信メール','送信メール'].includes(a.type)).slice(0,3);return hits.length?`<p>同じ業種の案件にある記録です。今回にも当てはまるか確認してください。</p>${hits.map(a=>`<p class="section-gap">${e(a.body)}</p>${sources([a.id])}`).join('')}`:'<p>同じ業種の別案件に、確認内容の根拠となる記録は見つかりませんでした。</p>'}if(prompt.includes('予算')){const hits=records.filter(a=>/予算|費用|金額/.test(a.body+' '+a.title));return hits.length?`<p>予算・費用について触れた記録です。予算額が確定したとは限りません。</p>${hits.map(a=>`<p class="section-gap">${e(a.body)}</p>${sources([a.id])}`).join('')}`:'<p>この案件に予算を確認した記録は見つかりませんでした。</p>'}return `<p>今回の仕事は「${e(t.title)}」です。</p><p class="section-gap">${e(t.description||t.title)}</p>${records.length?`<p class="section-gap">確認に使える直近の記録：</p>${records.slice(0,2).map(a=>`<p>${e(a.body)}</p>${sources([a.id])}`).join('')}`:'<p>過去の確認事項を裏づける活動記録はまだありません。</p>'}`;}if(ctx.d){const d=ctx.d,ms=db.meetings.filter(m=>m.deal===d.id),ts=db.tasks.filter(t=>t.dealId===d.id&&t.status!=='done'),acts=db.activities.filter(a=>a.dealId===d.id);if(prompt.includes('資料')||prompt.includes('履歴'))return `<p>この案件には${acts.length}件の活動があります。</p>${acts.slice(0,3).map(a=>`<div class="section-gap">${link(a.title,'activity/'+a.id)}</div>`).join('')}`;return `<p>${e(company(d.company).name)}の案件は「${e(d.stage)}」、${yen(d.amount)}です。未完了タスクは${ts.length}件です。</p>${ms.slice(0,2).map(m=>`<div class="section-gap"><b>${e(m.name)}</b><p>${phaseLabel(m.phase)}</p>${relatedItem(m.name,'meeting/'+m.id+'/brief','ミーティング')}</div>`).join('')}${!ms.length?`<div class="section-gap">${relatedItem(d.name,'deal/'+d.id+'/activities','案件')}</div>`:''}`}return `<p>タスクと案件データを確認できます。</p><div class="section-gap">${link('タスク一覧','tasks')}</div><div class="section-gap">${link('案件一覧','deals')}</div><div class="section-gap">${link('チャットで質問する','chat')}</div>`;}

document.addEventListener('submit',ev=>{if(ev.target.id==='context-form'){ev.preventDefault();const prompt=$('#context-input').value.trim();if(!prompt)return;const ctx=contextRecord();contextChats[ctx.key]||=[];contextChats[ctx.key].push({role:'user',text:prompt},{role:'assistant',html:contextAnswer(prompt,ctx)});render()}else if(ev.target.id==='meeting-note-form'){ev.preventDefault();const m=meeting(ev.target.dataset.meeting),note=$('#meeting-notes').value,title=$('#next-task').value.trim();m.notes=note;editing=false;if(title){const id='task-'+(++entitySequence);db.tasks.push({id,title,owner:m.owner||'Wada',executionMode:'human',kind:'次の対応',company:deal(m.deal).company,dealId:m.deal,due:'10/28',status:'open',route:'task/'+id})}const aid='note-'+m.id,existingNote=db.activities.find(a=>a.id===aid);if(existingNote){existingNote.body=note}else if(note.trim()){db.activities.unshift({id:aid,company:deal(m.deal).company,dealId:m.deal,meeting:m.id,title:m.name+'の記録',date:m.date,type:'商談記録',body:note})}toast('活動に記録しました');render()}});render();

$('#reset-demo').addEventListener('click',()=>{manualFlow=null;recurringPreview=false;workflowSelection=null;workflowPickerTask=null;taskContextId=null;Object.keys(overviewState).forEach(k=>delete overviewState[k]);needsMyAction=true;assistantOpen=true;historyExpanded=false;homeView='chat';activeThread='thread-1';threadSequence=1;chatState={messages:[],prompt:chatPrompts[0]};chatThreads=[{id:activeThread,title:'新しいチャット',date:'2026-10-26',state:chatState},...pastChats()];Object.keys(contextChats).forEach(k=>delete contextChats[k]);Object.keys(contextDrafts).forEach(k=>delete contextDrafts[k]);render()});
document.addEventListener('click',ev=>{const a=ev.target.closest('a[data-metric-route]');if(a?.dataset.metricRoute){ev.preventDefault();go(a.dataset.metricRoute)}});
if(globalThis.location&&globalThis.history){const parse=()=>{const value=decodeURIComponent(location.hash.replace(/^#\//,''));return /^(chat|dashboard|tasks|customers|deals|flows|customer\/[a-zA-Z0-9-]+|deal\/[a-zA-Z0-9-]+(?:\/[a-z]+)?|meeting\/[a-zA-Z0-9-]+(?:\/[a-z]+)?|activity\/[a-zA-Z0-9-]+|task\/[a-zA-Z0-9-]+|flow\/f[1234]|run\/r1|metric\/(?:meetings|won|amount)(?:\/2026-10-\d{2})?)$/.test(value)?value:'chat'};route=parse();taskContextId=history.state?.taskContextId||null;const validRoute=()=>{const [page,id]=route.split('/');return !id||page==='metric'||({customer:db.companies,deal:db.deals,meeting:db.meetings,activity:db.activities,task:db.tasks}[page]||[{id}]).some(x=>x.id===id)};if(!validRoute())route='not-found';restoreTaskContext();history.replaceState({route,taskContextId},'', '#/'+route);globalThis.addEventListener('popstate',()=>{route=parse();taskContextId=history.state?.taskContextId||null;if(!validRoute())route='not-found';restoreTaskContext();editing=false;render()});render()}
document.addEventListener('submit',ev=>{if(ev.target.id==='activity-filter'){ev.preventDefault();activityQuery=$('#activity-query').value.trim();render()}});
document.addEventListener('submit',ev=>{if(ev.target.id==='manual-flow-select'){ev.preventDefault();const tid=$('#manual-task').value;if(manualFlow&&applicableTasks(manualFlow.flow,manualFlow.deal).some(t=>t.id===tid)){manualFlow.task=tid;render()}return}if(ev.target.id==='workflow-select'){ev.preventDefault();const flow=$('#workflow-template').value,t=db.tasks.find(t=>t.id===ev.target.dataset.task);if(t&&workflowTemplates.some(f=>f.id===flow)){workflowSelection={flow,task:t.id,deal:t.dealId};render()}}});
document.addEventListener('submit',ev=>{if(ev.target.id==='definition-form'){ev.preventDefault();const f=db.workflowDefinitions[ev.target.dataset.flow];f.instruction=$('#definition-instruction').value.trim();f.version++;render();toast('変更を保存しました')}});
document.addEventListener('click',ev=>{const card=ev.target.closest('[data-record-go]');if(card&&!ev.target.closest('button,a,input,textarea,select'))go(card.dataset.recordGo)});document.addEventListener('keydown',ev=>{const card=ev.target.closest('[data-record-go]');if(card&&ev.target===card&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();go(card.dataset.recordGo)}});
</script></body></html>
