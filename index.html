function dealPage(id,tab='activities'){const d=deal(id),c=company(d.company),p=db.proposal;const actions=[['memo','メモ'],['email','メール'],['task','タスク'],['meeting','打ち合わせ']];const prop=editing?`<form id="deal-properties" data-deal="${id}"><div class="field"><label for="prop-name">案件名</label><input id="prop-name" required value="${e(d.name)}"></div><div class="field"><label for="prop-stage">ステージ</label><select id="prop-stage">${['ヒアリング','提案中','受注'].map(x=>`<option ${x===d.stage?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="prop-amount">案件金額（円）</label><input id="prop-amount" type="number" min="0" required value="${d.amount}"></div><div class="field"><label for="prop-close">受注予定日</label><input id="prop-close" type="date" required value="${d.close}"></div><div class="actions">${btn('戻る','cancel-edit')}<button class="btn primary" type="submit">保存</button></div></form>`:`<dl class="record-props"><dt>ステージ</dt><dd>${badge(d.stage)}</dd><dt>案件金額</dt><dd>${yen(d.amount)}</dd><dt>受注予定日</dt><dd>${e(d.close)}</dd><dt>担当</dt><dd>${e(d.owner||'akane')}</dd></dl><div class="section-gap">${btn('編集','edit')}</div>`;const proposal=id==='d1'&&p.status==='pending'?card('受注予定日の更新案',`<div class="pad"><p>山田さんのメールでは、導入判断は11月中の予定です。</p><div class="diff"><div><small>現在</small>${e(d.close)}</div><span>→</span><div><small>変更案</small>${p.after}</div></div>${sources(['a2'])}<div class="actions">${btn('採用しない','reject-update')}${btn('更新する','accept-update',true)}</div></div>`,badge('確認待ち','amber')):'';let content;if(actions.some(([a])=>a===tab))content=composeForm(d,tab);else if(tab==='overview')content=card('概要',`<div class="pad"><p>${e(d.description||(id==='d4'?'受注業務の現状整理ワークショップ。成果物を共有して完了。':c.summary))}</p>${sources(db.activities.filter(a=>a.dealId===id&&a.type==='商談記録').map(a=>a.id))}</div>`);else content=dealTimeline(d);return crumb('案件','deals',d.name)+heading(d.name)+`<div class="record-grid"><aside>${card('案件情報',`<div class="pad">${prop}</div>`)}</aside><div><div class="tabs"><button class="${tab==='overview'?'active':''}" data-go="deal/${id}/overview">概要</button><button class="${tab!=='overview'?'active':''}" data-go="deal/${id}/activities">活動</button></div><div class="row activity-actions">${actions.map(([key,label])=>`<button class="btn small ${tab===key?'primary':''}" data-go="deal/${id}/${key}">${label}</button>`).join('')}</div>${proposal}${content}</div><aside>${card('顧客',`<div class="listline">${link(c.name,'customer/'+c.id)}</div>`)}${card('担当窓口',`<div class="listline"><b>${e(c.person)}</b><div class="small muted email-address">${e(c.email)}</div></div>`)}</aside></div>`}
function dealTimeline(d){const next=db.meetings.find(m=>m.deal===d.id&&m.phase!=='complete');const nextCard=next?card('次のアクション',`<div class="pad row between"><div><b>${e(next.name)}</b><div class="small muted">${phaseLabel(next.phase)}</div></div><button class="btn primary" data-go="meeting/${next.id}/brief">進める</button></div>`):'';const upcoming=[...db.meetings.filter(m=>m.deal===d.id).map(m=>({title:m.name,date:m.date,type:'打ち合わせ',to:'meeting/'+m.id+'/brief'})),...db.tasks.filter(t=>t.dealId===d.id&&t.status==='open').map(t=>({title:t.title,date:'2026-'+t.due.replace('/','-'),type:'ToDo',to:t.route}))].sort((a,b)=>a.date.localeCompare(b.date));const history=db.activities.filter(a=>a.dealId===d.id).sort((a,b)=>b.date.localeCompare(a.date));return nextCard+card('予定・ToDo',upcoming.map(a=>`<div class="listline"><div class="row between">${badge(a.type)}<span class="small muted">${e(a.date)}</span></div><div style="margin-top:8px">${link(a.title,a.to)}</div></div>`).join('')||'<div class="pad muted">予定はありません</div>')+`<h2 style="margin-bottom:14px">活動</h2>${history.map(a=>`<article class="activity-card"><header><span class="avatar">${a.actor==='AI'?'AI':e((a.actor||'akane').slice(0,1))}</span><div><b>${e(a.actor||(a.type==='受信メール'?company(a.company).person:'akane'))}</b><span class="small muted"> · ${a.date}</span><h3>${e(a.title)}</h3></div></header><div class="pad"><div class="small muted">${e(a.type)}</div><div class="prose small" style="margin-top:8px">${e(a.body)}</div><div class="actions">${link('内容を見る',a.meeting?'meeting/'+a.meeting+'/brief':'activity/'+a.id)}</div></div></article>`).join('')||'<div class="card pad muted">活動はありません</div>'}`}
function composeForm(d,type){const names={memo:'メモを残す',email:'メールを書く',task:'タスクを作る',meeting:'打ち合わせを登録'};return card(names[type],`<form id="compose-form" data-deal="${d.id}" data-kind="${type}" class="pad">${type==='email'?`<div class="small muted" style="margin-bottom:18px">宛先：${e(company(d.company).person)} &lt;${e(company(d.company).email)}&gt;</div>`:''}<div class="field"><label for="compose-title">${type==='email'?'件名':'タイトル'}</label><input id="compose-title" required></div>${['memo','email'].includes(type)?'<div class="field"><label for="compose-body">内容</label><textarea id="compose-body" required></textarea></div>':''}${['task','meeting'].includes(type)?`<div class="field"><label for="compose-date">${type==='task'?'期限':'日時'}</label><input id="compose-date" type="${type==='task'?'date':'datetime-local'}" required value="${type==='task'?'2026-10-27':'2026-10-27T14:00'}"></div>`:''}<div class="actions"><button class="btn" type="button" data-go="deal/${d.id}/activities">キャンセル</button><button class="btn primary" type="submit">${type==='email'?'下書きを保存':'保存'}</button></div></form>`)}

function meetingPage(id){const m=meeting(id),d=deal(m.deal),c=company(d.company);return crumb(d.name,'deal/'+d.id+'/activities',m.name)+heading(m.name,'',badge(phaseLabel(m.phase),m.phase==='complete'?'green':m.phase?.includes('review')?'amber':''))+props([['日時',m.date],['顧客',link(c.name,'customer/'+c.id)],['担当',e(m.owner||d.owner||'akane')],['案件',link(d.name,'deal/'+d.id)]])+`<div class="meeting-work"><div>${meetingCards(m)}${card('商談記録',`<form id="meeting-note-form" data-meeting="${id}" class="pad"><div class="field"><label for="meeting-notes">決まったこと・確認したこと</label><textarea id="meeting-notes">${e(m.notes)}</textarea></div><div class="field"><label for="next-task">次の対応</label><input id="next-task" placeholder="次のタスク"></div><div class="actions"><button class="btn" type="submit">記録を保存</button></div></form>`)}</div><aside>${nextAction(m)}${card('関連する案件',`<div class="listline">${link(d.name,'deal/'+d.id)}</div>`)}${card('業務フロー',`<div class="listline">${link('商談準備','flow/f1')}</div>`)}</aside></div>`}
function meetingCards(m){const c=company(deal(m.deal).company),mail=db.mails[m.id];let entries=db.activities.filter(a=>a.dealId===m.deal&&!a.meeting&&a.type!=='活動記録').map(a=>({at:a.date,title:a.title,actor:a.type==='受信メール'?c.person:(a.actor||'akane'),body:`<div class="small muted">${e(a.type)}</div><p class="prose" style="margin-top:8px">${e(a.body)}</p><div class="actions">${link('詳細を開く','activity/'+a.id)}</div>`}));const events=m.events||[];let hasBrief=false,hasMail=false;for(const ev of events){let content=ev.body?`<p>${e(ev.body)}</p>`:'';if(ev.id.includes('-prepared')){hasBrief=true;content=ev.id.includes('-'+m.revision+'-')?briefArtifact(m):`<div class="prose">${e(ev.artifact||'資料を保存しました。')}</div>`}if(ev.id.includes('-drafted')){hasMail=true;content=mailArtifact(m)}entries.push({at:ev.at||'2026-10-26 09:00',title:ev.title,actor:ev.actor,body:content})}if(m.prepared&&!hasBrief)entries.push({at:'2026-10-26 06:00',title:'準備資料を作成',actor:'AI',body:briefArtifact(m)});if(mail&&!hasMail)entries.push({at:'2026-10-26 06:05',title:'メール下書きを作成',actor:'AI',body:mailArtifact(m)});return entries.sort((a,b)=>a.at.localeCompare(b.at)).map(x=>`<article class="activity-card"><header><span class="avatar">${x.actor==='AI'?'AI':e(x.actor.slice(0,1))}</span><div><b>${e(x.actor)}</b><span class="muted small"> · ${e(x.at)}</span><h3>${e(x.title)}</h3></div></header><div class="pad">${x.body}</div></article>`).join('')}
function briefArtifact(m){const review=['brief-review','prepared'].includes(m.phase);return `${badge(m.reviewed?'確認済み':'確認待ち',m.reviewed?'green':'amber')}<div class="section-gap">${editing?`<textarea id="brief-edit" style="min-height:280px">${e(m.brief)}</textarea><div class="actions">${btn('キャンセル','cancel-edit')}${btn('資料を保存','save-brief:'+m.id,true)}</div>`:`<div class="prose">${e(m.brief)}</div>${sources(m.sourceIds||[])}<div class="actions">${btn('編集する','edit')}</div>`}</div>${review?`<div class="artifact-actions"><div class="field"><label for="revision-request">修正してほしいこと</label><textarea id="revision-request" style="min-height:90px" placeholder="例：予算の確認を追加して"></textarea></div><div class="row">${btn('AIに修正を依頼','request-revision:'+m.id)}${btn('確認して次へ','approve-brief:'+m.id,true)}</div></div>`:''}`}
function mailArtifact(m){const mail=db.mails[m.id];if(!mail)return '';const c=company(deal(m.deal).company);return `${badge(mail.status==='sent'?'送信済み':'下書き',mail.status==='sent'?'green':'')}<p class="small muted" style="margin:12px 0">宛先：${e(c.person)} &lt;${e(c.email)}&gt;</p>${mail.status==='sent'?`<h3>${e(mail.subject)}</h3><div class="prose section-gap">${e(mail.body)}</div>`:`<label class="small" for="meeting-mail-title">件名</label><input id="meeting-mail-title" value="${e(mail.subject)}"><label class="small" for="meeting-mail-body">本文</label><textarea id="meeting-mail-body">${e(mail.body)}</textarea>`}${sources(mail.sourceIds||[])}${mail.status==='draft'?`<div class="actions">${btn('下書きを保存','lifecycle-save-mail:'+m.id)}${m.phase==='mail-review'?btn('内容を確認して送信','lifecycle-send:'+m.id,true):''}</div>`:''}`}
function phaseLabel(p){return ({'not-started':'未着手',prepared:'資料保存済み',preparing:'準備資料を作成中','brief-review':'資料の確認待ち',drafting:'メール案を作成中','mail-review':'送信の確認待ち',complete:'完了'})[p]||'未着手'}
function nextAction(m){let body;if(['preparing','drafting'].includes(m.phase))body=`<p>AIが${m.phase==='preparing'?'準備資料':'メール案'}を作成しています。</p>${badge('Doing','blue')}`;else if(['brief-review','prepared'].includes(m.phase))body='<p>準備資料のカードで内容を確認してください。確認後、AIがメール下書きを作成します。</p>';else if(m.phase==='mail-review')body='<p>メールのカードで宛先と内容を確認して送信します。</p>';else if(m.phase==='complete')body=`<p>メールを送信しました。打ち合わせの結果を活動に記録できます。</p>${badge('Done','green')}`;else body=`<p>${e(m.date)}の打ち合わせに向けた資料が未作成です。案件と過去の活動を参照して準備します。</p><div class="actions">${btn('AIに準備を任せる','start-preparation:'+m.id,true)}</div>`;return card('次のアクション',`<div class="pad">${body}</div>`)}
function activityPage(id){const a=db.activities.find(a=>a.id===id),c=company(a.company),d=a.dealId?deal(a.dealId):null;const draft=a.type==='メール下書き';return crumb(d?d.name:c.name,d?'deal/'+d.id+'/activities':'customer/'+c.id,a.title)+heading(a.title)+props([['日時',a.date],['種類',a.type],['顧客',link(c.name,'customer/'+c.id)],['案件',d?link(d.name,'deal/'+d.id):'顧客全体']])+`<div class="detail-cols">${card(a.type,draft?`<form id="draft-form" data-activity="${id}" class="pad"><div class="small muted" style="margin-bottom:18px">宛先：${e(c.email)}</div><div class="field"><label for="draft-title">件名</label><input id="draft-title" required value="${e(a.title)}"></div><div class="field"><label for="draft-body">本文</label><textarea id="draft-body" required>${e(a.body)}</textarea></div><div class="actions"><button class="btn" type="submit" name="mode" value="save">下書きを保存</button><button class="btn primary" type="submit" name="mode" value="send">内容を確認して送信</button></div></form>`:`<div class="pad">${a.meeting?`<div class="small muted" style="margin-bottom:18px">関連する打ち合わせ：${link(meeting(a.meeting).name,'meeting/'+a.meeting+'/mail')}</div>`:''}<div class="prose">${e(a.body)}</div></div>`)}${related(c,d)}</div>`}
function taskPage(id){const t=db.tasks.find(t=>t.id===id),c=company(t.company),d=t.dealId?deal(t.dealId):null;const why=t.reason||(id==='t3'?'佐々木さんから費用感の相談が届いています。予算が未確認のため、提案する範囲を決める前に確認が必要です。':id==='t4'?'見積作成の現状を把握するため、初回ヒアリングの日程を決めます。':'案件の次の対応として登録されたタスクです。');const what=t.description||(id==='t3'?'佐々木さんに予算の目安と検討時期を確認し、対応結果を記録する。':id==='t4'?'高橋さんに候補日を連絡し、確定した日程を記録する。':t.title);return crumb('タスク','tasks',t.title)+heading(t.title,'',badge(t.status==='done'?'完了':'ToDo',t.status==='done'?'green':''))+props([['期限',e(t.due)],['担当',e(t.owner||'akane')],['顧客',link(c.name,'customer/'+c.id)],['案件',d?link(d.name,'deal/'+d.id):'顧客全体']])+`<div class="detail-cols"><div>${card('対応内容',`<div class="pad"><h3>すること</h3><p style="margin-top:8px">${e(what)}</p><h3 class="section-gap">背景</h3><p style="margin-top:8px">${e(why)}</p><div class="field section-gap"><label for="task-note">対応結果</label><textarea id="task-note" placeholder="確認した内容と次の対応">${e(t.note||'')}</textarea></div><div class="actions">${btn('記録を保存','save-task:'+id)}${t.status!=='done'?btn('記録して完了','complete-task:'+id,true):''}</div></div>`)}</div>${related(c,d)}</div>`}
function flowsPage(){return heading('業務フロー')+card('フロー一覧',`<div class="task"><div class="task-symbol">${icon('flows')}</div><div><div class="task-title">${link(db.flow.name,'flow/f1')}</div><div class="task-meta">${e(db.flow.target)} · ${e(db.flow.trigger)}</div></div>${badge(db.flow.enabled?'有効':'停止中',db.flow.enabled?'green':'')}</div>`)}
function flowPage(){const f=db.flow;return crumb('業務フロー','flows',f.name)+heading(f.name,'',`<div class="row">${badge(f.enabled?'有効':'停止中',f.enabled?'green':'')}${btn(f.enabled?'一時停止':'再開','toggle-flow')}</div>`)+`<div class="workflow-grid"><div>${card('手順',`<div class="flow">${[['対象の商談を取得',f.target],['顧客・案件・活動履歴を取得',f.context],['準備資料とメール下書きを作成','参照した活動を成果物に紐づける'],['担当者へ引き渡す',f.policy==='review'?'確認タスクを作成':'準備資料を保存']].map(([t,s],i)=>`${i?'<div class="connector"></div>':''}<div class="node"><b>${t}</b><div class="small muted">${e(s)}</div></div>`).join('')}</div>`)}${card('実行履歴',`<div class="listline row between">${link('北辰物流の商談準備','run/r1')}${badge(db.run.status==='running'?'進行中':db.run.status==='done'?'完了':'停止',db.run.status==='running'?'blue':'')}</div>`)}</div><div>${card('自動実行の設定',`<form id="flow-form" class="pad"><div class="field"><label for="flow-target">対象</label><select id="flow-target"><option ${f.target.includes('翌日')?'selected':''}>自分が担当する翌日の商談</option><option ${f.target.includes('当日')?'selected':''}>自分が担当する当日の商談</option></select></div><div class="field"><label for="flow-trigger">実行するタイミング</label><select id="flow-trigger"><option ${f.trigger.includes('06')?'selected':''}>毎営業日 06:00</option><option ${f.trigger.includes('18')?'selected':''}>毎営業日 18:00</option></select></div><div class="field"><label for="flow-policy">成果物の確認</label><select id="flow-policy"><option value="review" ${f.policy==='review'?'selected':''}>確認タスクを作成する</option><option value="save" ${f.policy==='save'?'selected':''}>資料保存のみ</option></select></div><div class="field"><label>実行を許可する操作</label><div class="small">✓ 顧客・案件・活動の参照<br>✓ 商談への資料保存<br>✓ メール下書きの作成</div></div><div class="actions"><button class="btn primary" type="submit">設定を保存</button></div></form>`)}<button class="btn" data-action="sample-run" ${f.enabled?'':'disabled'}>サンプル商談で試す</button></div></div>`}
function runPage(){const r=db.run,m=meeting(r.meeting),c=company(deal(m.deal).company);return crumb('タスク','tasks',c.name+'の商談準備')+heading(c.name+'の商談準備','',badge(r.status==='running'?'進行中':r.status==='done'?'完了':'停止',r.status==='running'?'blue':r.status==='done'?'green':''))+props([['対象の商談',link(m.name,'meeting/'+m.id+'/brief')],['業務フロー',link('商談準備','flow/f1')],['実行方法','自動実行'],['担当','akane']])+card('進捗',`<ol class="steps">${['対象の商談を取得','顧客・案件・活動履歴を取得','準備資料を作成','成果物を保存'].map((s,i)=>`<li><span class="task-symbol">${i<r.step?'✓':i+1}</span><span>${s}</span>${r.status==='running'&&i===r.step?badge('処理中','blue'):''}</li>`).join('')}</ol>`)+`<div class="row">${r.status==='running'?btn('実行を停止','stop-run'):''}${r.status==='done'?`<button class="btn primary" data-go="meeting/${m.id}/brief">準備資料を開く</button>`:''}</div>`}
function render(){const [page,id,tab]=route.split('/');$('#complete-demo').hidden=!(page==='run'&&db.run.status==='running');const active=({customer:'customers',deal:'deals',meeting:'deals',activity:db.activities.find(a=>a.id===id)?.dealId?'deals':'customers',task:'tasks',run:'tasks',flow:'flows'})[page]||page;$('#nav').innerHTML=[['dashboard','ダッシュボード'],['tasks','タスク'],['deals','案件'],['customers','顧客'],['flows','業務フロー']].map(([k,v])=>`<button data-go="${k}" class="${active===k?'active':''}" ${active===k?'aria-current="page"':''}>${icon(k)}${v}</button>`).join('');$('#main').innerHTML=page==='tasks'?tasksPage():page==='dashboard'?dashboard():['customers','deals','meetings'].includes(page)?listPage(page):page==='customer'?customerPage(id):page==='deal'?dealPage(id,tab):page==='meeting'?meetingPage(id,tab):page==='activity'?activityPage(id):page==='task'?taskPage(id):page==='flows'?flowsPage():page==='flow'?flowPage():runPage()}
function complete(id){const t=db.tasks.find(t=>t.id===id);if(t)t.status='done'}
function prepare(id){const m=meeting(id);m.prepared=true;m.sourceIds=db.activities.filter(a=>a.dealId===m.deal&&['商談記録','受信メール','送信メール','メモ'].includes(a.type)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3).map(a=>a.id);if(!db.mails[id])db.mails[id]={subject:'次回のお打ち合わせについて',body:company(deal(m.deal).company).person+'様\n\nお世話になっております。キジトラのakaneです。\n次回は現在の管理表、対応履歴の共有方法とご予算の目安をお伺いできればと思います。\n\nよろしくお願いいたします。',status:'draft',sourceIds:[...m.sourceIds]};m.brief=id==='m1'?initial.meetings[0].brief:'今回の打ち合わせ\n'+m.name+'\n\n案件\n'+deal(m.deal).name+'\n\n確認すること\n・対象の業務と現状の進め方\n・導入時期と予算感\n\nこれまでの記録\n'+m.sourceIds.map(aid=>db.activities.find(a=>a.id===aid).body).join('\n\n');}
document.addEventListener('click',ev=>{const el=ev.target.closest('button');if(!el)return;if(el.dataset.go){go(el.dataset.go);return}if(el.dataset.taskScope){taskScope=el.dataset.taskScope;render();return}if(el.dataset.filter){filter=el.dataset.filter;render();return}const [a,id]=(el.dataset.action||'').split(':');if(!a)return;if(handleLifecycleAction(a,id))return;switch(a){case'clear-search':search='';dealStage='all';dealOwner='all';break;case'view-kanban':dealView='kanban';break;case'view-list':dealView='list';break;case'edit':editing=true;break;case'cancel-edit':editing=false;break;case'save-brief':meeting(id).brief=$('#brief-edit').value;editing=false;toast('準備資料を保存しました');break;case'review-brief':meeting(id).reviewed=true;db.tasks.filter(t=>t.route==='meeting/'+id+'/brief').forEach(t=>t.status='done');toast('確認済みにしました');break;case'save-mail':activeMail().subject=$('#mail-subject').value;activeMail().body=$('#mail-body').value;editing=false;toast('下書きを保存しました');break;case'send-mail':{const mid=route.split('/')[1],mail=activeMail();if(!mail||mail.status!=='draft')break;mail.status='sent';const aid='sent-'+mid;db.activities.unshift({id:aid,company:deal(meeting(mid).deal).company,dealId:meeting(mid).deal,meeting:mid,title:mail.subject,date:'2026-10-26 09:00',type:'送信メール',body:mail.body});if(mid==='m1')complete('t1');toast('デモ内で送信済みにしました（実際の送信はありません）');break;}case'accept-update':deal('d1').close=db.proposal.after;db.proposal.status='accepted';complete('t2');toast('受注予定日を更新しました');break;case'reject-update':db.proposal.status='rejected';complete('t2');toast('更新案を採用しませんでした');break;case'prepare':prepare(id);toast('商談に準備資料を保存しました');break;case'save-notes':{const m=meeting(id);m.notes=$('#meeting-notes').value;const title=$('#next-task').value.trim();if(title){const tid='task-'+(++entitySequence);db.tasks.push({id:tid,title,kind:'自分のタスク',company:deal(m.deal).company,dealId:m.deal,due:'10/28',status:'open',route:'task/'+tid})}if(m.notes.trim()){const aid='note-'+id;db.activities=db.activities.filter(a=>a.id!==aid);db.activities.unshift({id:aid,company:deal(m.deal).company,dealId:m.deal,title:m.name+'の記録',date:m.date,type:'商談記録',body:m.notes})}toast(title?'商談記録と次のタスクを保存しました':'商談記録を保存しました');break}case'save-task':{const t=db.tasks.find(t=>t.id===id);t.note=$('#task-note').value;toast('対応結果を保存しました');break}case'complete-task':{const t=db.tasks.find(t=>t.id===id);t.note=$('#task-note').value;complete(id);toast('対応結果を記録しました');break}case'toggle-flow':db.flow.enabled=!db.flow.enabled;toast(db.flow.enabled?'自動実行を再開しました':'次回からの自動実行を停止しました');break;case'sample-run':db.run.status='running';db.run.step=2;db.run.policy=db.flow.policy;route='run/r1';break;case'stop-run':db.run.status='stopped';toast('実行を停止しました');break;case'finish-run':db.run.status='done';db.run.step=4;prepare('m2');meeting('m2').reviewed=false;if(db.run.policy==='review'&&db.tasks.some(t=>t.id==='review-m2'))db.tasks.find(t=>t.id==='review-m2').status='open';if(db.run.policy==='review'&&!db.tasks.some(t=>t.id==='review-m2'))db.tasks.push({id:'review-m2',title:'北辰物流の商談準備資料',kind:'準備資料の確認',company:'c2',dealId:'d2',due:'10/27',status:'open',route:'meeting/m2/brief'});toast(db.run.policy==='review'?'資料を保存し、確認タスクを追加しました':'商談に準備資料を保存しました');break}render()});

function chatResponse(text){const q=text.replace(/[\s。？！?!]/g,'');let type='unsupported';if(q.includes('商談準備'))type='lifecycle';else if(q.includes('表')||q.includes('一覧')||q.includes('データ'))type='table';else if(q.includes('結果')||q.includes('確認済み')||q.includes('進ん'))type='status';else if(q.includes('メール')||q.includes('下書き'))type='mail';else if(q.includes('更新')||q.includes('予定日'))type='update';else if(q.includes('確認すること')||q.includes('タスク')||q.includes('今日'))type='tasks';chatState.messages.push({role:'user',text},{role:'assistant',type,html:chatAnswer(type)});chatState.prompt=type==='tasks'?chatPrompts[1]:type==='mail'?chatPrompts[3]:type==='update'?chatPrompts[3]:type==='status'?chatPrompts[2]:chatPrompts[0];render();}

${e(db.mails.m1.subject)}</b>${badge(db.mails.m1.status==='sent'?'送信済み':'下書き',db.mails.m1.status==='sent'?'green':'')}</div><p class="small muted" style="margin:9px 0">宛先：${e(company('c1').person)}</p><div class="prose">${e(db.mails.m1.body)}</div>${sources(db.mails.m1.sourceIds)}<div class="actions"><button class="btn primary" data-go="meeting/m1/mail">メールを開く</button></div></div>`}if(type==='update'){const p=db.proposal;return p.status==='pending'?`<p>青葉製作所の案件に、受注予定日の更新案があります。根拠は山田さんからのメールです。</p><div class="chat-preview"><h3>${e(deal('d1').name)}</h3><div class="diff"><div><small>現在</small>${e(deal('d1').close)}</div><span>→</span><div><small>更新案</small>${e(p.after)}</div></div>${sources(['a2'])}<div class="actions"><button class="btn primary" data-go="deal/d1">案件で確認する</button></div></div>`:`<p>受注予定日の更新案は${p.status==='accepted'?'反映済み':'不採用'}です。現在の受注予定日は${e(deal('d1').close)}です。</p><div class="actions"><button class="btn" data-go="deal/d1">案件を開く</button></div>`}if(type==='status'){const progressed=db.meetings.filter(m=>m.events?.length);const mail=db.mails.m1.status==='sent',p=db.proposal;return `<p>現在の確認状況です。</p><div class="chat-cards"><div class="chat-card"><div><h3>青葉製作所へのメール</h3><span class="small muted">${mail?'送信済み':'下書き・確認待ち'}</span></div><button class="btn small" data-go="meeting/m1/mail">内容を見る</button></div><div class="chat-card"><div><h3>受注予定日の更新案</h3><span class="small muted">${p.status==='accepted'?'反映済み':p.status==='rejected'?'不採用':'確認待ち'} · 現在 ${e(deal('d1').close)}</span></div><button class="btn small" data-go="deal/d1">案件を見る</button></div></div>${progressed.map(m=>`<div class="chat-card section-gap"><div><h3>${e(m.name)}</h3><span class="small muted">${phaseLabel(m.phase)}</span></div><button class="btn small" data-go="meeting/${m.id}/brief">活動を見る</button></div>`).join('')}<p class="small muted" style="margin-top:16px">残りのToDo：${db.tasks.filter(t=>t.status==='open'&&(!t.owner||t.owner==='akane')).length}件</p>`}return '<p>このシナリオでは、タスクの確認、青葉製作所のメール案、案件の更新案、確認結果、案件の表表示を試せます。下の候補から選んでください。</p>';}
function chatPage(){return `<section class="chat-workspace"><header class="chat-heading"><h1>${chatState.messages.length?'ホーム':'何から進めますか？'}</h1>${chatState.messages.length?'':'<p class="muted">確認する仕事から、そのまま進められます。</p>'}</header><div class="chat-transcript" aria-live="polite">${chatState.messages.map(m=>m.role==='user'?`<div class="chat-message user"><div>${e(m.text)}</div></div>`:`<div class="chat-message assistant"><div class="chat-speaker">AIアシスタント</div>${m.html}</div>`).join('')}</div><div class="chat-input-area"><div class="chat-suggestions">${chatPrompts.map((p,i)=>`<button class="btn small" data-chat-prompt="${i}">${['確認すること','メール案','案件の更新案','確認結果','案件データ','商談準備'][i]}</button>`).join('')}</div><form id="chat-form"><label for="chat-input" class="visually-hidden">AIへの依頼</label><textarea id="chat-input" rows="2" placeholder="依頼することを入力">${e(chatState.prompt)}</textarea><div class="chat-send"><span class="small muted">Enterで送信 · Shift+Enterで改行</span><button id="chat-send" class="btn primary" type="submit" ${chatState.prompt.trim()?'':'disabled'}>送信</button></div></form></div></section>`}

function logMeeting(m,key,title,actor,body=''){const id='life-'+m.id+'-'+m.revision+'-'+key;if((m.events||[]).some(x=>x.id===id))return;m.events||=[];m.events.push({id,title,actor,body,at:'2026-10-26 09:'+String(Math.min(59,m.events.length+1)).padStart(2,'0'),artifact:key==='prepared'?m.brief:undefined});db.activities.unshift({id,company:deal(m.deal).company,dealId:m.deal,meeting:m.id,title,date:'2026-10-26 09:'+String(Math.min(59,m.events.length)).padStart(2,'0'),type:'活動記録',actor,body:body||title});}
function lifecycleTask(m,kind,state){const d=deal(m.deal),id=kind==='prepare'&&m.id==='m2'?'t50':kind==='mail-review'&&m.id==='m1'?'t1':kind+'-'+m.id;let t=db.tasks.find(t=>t.id===id);const isReview=kind==='review'||kind==='mail-review',title={prepare:'商談準備',review:'準備資料の確認',draft:'事前確認メールの作成','mail-review':'メール送信の確認'}[kind];if(!t){t={id,company:d.company,dealId:d.id,due:'10/27',meetingId:m.id,parentExecution:m.executionId,route:'meeting/'+m.id+'/brief'};db.tasks.push(t)}Object.assign(t,{title:company(d.company).name+' / '+title,kind:title,status:state,owner:isReview?(m.owner||'akane'):'AI',executionMode:isReview?'collaborative':'ai',needsHuman:isReview&&state==='open'});return t;}
function tickMeeting(m){if(m.phase==='preparing'){prepare(m.id);delete db.mails[m.id];m.phase=db.flow.policy==='save'?'prepared':'brief-review';m.reviewed=false;if(m.revisionRequest)m.brief+='\n\n追加の確認事項\n'+m.revisionRequest;logMeeting(m,'prepared','準備資料を作成','AI');lifecycleTask(m,'prepare','done');if(db.flow.policy!=='save')lifecycleTask(m,'review','open');if(m.id==='m2'){db.run.status='done';db.run.step=4}}else if(m.phase==='drafting'){const c=company(deal(m.deal).company);db.mails[m.id]={subject:m.name+'に向けた事前確認',body:c.person+'様\n\nお世話になっております。\n次回の'+m.name+'では、対象業務、導入時期、ご予算について確認できればと思います。\n関連資料がありましたらご共有ください。\n\nよろしくお願いいたします。',status:'draft',sourceIds:[...(m.sourceIds||[])]};m.phase='mail-review';logMeeting(m,'drafted','メール下書きを作成','AI');lifecycleTask(m,'draft','done');lifecycleTask(m,'mail-review','open')}else return;toast('次の確認タスクを作成しました');render();}
function handleLifecycleAction(a,id){if(a==='toggle-assistant'){assistantOpen=!assistantOpen;render();return true}if(!['start-preparation','request-revision','approve-brief','lifecycle-tick','lifecycle-save-mail','lifecycle-send','sample-run','finish-run','stop-run'].includes(a))return false;const m=meeting(['sample-run','finish-run','stop-run'].includes(a)?db.run.meeting:(id||route.split('/')[1]));if(!m)return true;if(a==='sample-run'){m.phase='not-started';route='meeting/'+m.id+'/brief';return handleLifecycleAction('start-preparation',m.id)}if(a==='finish-run'){tickMeeting(m);return true}if(a==='stop-run'){db.run.status='stopped';m.phase='not-started';lifecycleTask(m,'prepare','open');logMeeting(m,'stopped','実行を停止','akane');render();return true}if(a==='start-preparation'){if(!['not-started',undefined].includes(m.phase))return true;m.phase='preparing';logMeeting(m,'started','商談準備を依頼','akane');lifecycleTask(m,'prepare','running');if(m.id==='m2'){db.run.status='running';db.run.step=2}}else if(a==='request-revision'){if(!['brief-review','prepared'].includes(m.phase))return true;const request=$('#revision-request').value.trim();if(!request){toast('修正したい内容を入力してください');return true}m.revisionRequest=request;logMeeting(m,'revision-request','資料の修正を依頼','akane',request);lifecycleTask(m,'review','done');m.revision++;m.phase='preparing';lifecycleTask(m,'prepare','running')}else if(a==='approve-brief'){if(!['brief-review','prepared'].includes(m.phase))return true;m.reviewed=true;m.phase='drafting';lifecycleTask(m,'review','done');lifecycleTask(m,'draft','running');logMeeting(m,'approved','準備資料を確認','akane')}else if(a==='lifecycle-tick'){tickMeeting(m);return true}else{const mail=db.mails[m.id];if(!mail||mail.status!=='draft')return true;mail.subject=$('#meeting-mail-title').value;mail.body=$('#meeting-mail-body').value;if(a==='lifecycle-send'){mail.status='sent';m.phase='complete';lifecycleTask(m,'mail-review','done');if(m.id==='m1')complete('t1');const aid='sent-'+m.id;if(!db.activities.some(x=>x.id===aid))db.activities.unshift({id:aid,company:deal(m.deal).company,dealId:m.deal,meeting:m.id,title:mail.subject,date:'2026-10-26 09:30',type:'送信メール',body:mail.body});logMeeting(m,'sent','メールを送信','akane');toast('デモ内で送信済みにしました')}else toast('下書きを保存しました')}render();return true;}
function contextRecord(){const [page,id]=route.split('/');let d=null,m=null;if(page==='deal')d=deal(id);if(page==='meeting'){m=meeting(id);d=deal(m.deal)}if(page==='activity'){const a=db.activities.find(a=>a.id===id);d=a?.dealId?deal(a.dealId):null}if(page==='task'){const t=db.tasks.find(t=>t.id===id);d=t?.dealId?deal(t.dealId):null}return {d,m,key:d?'deal-'+d.id:route,label:d?d.name:page==='customer'?company(id).name:page==='dashboard'?'営業ダッシュボード':'ワークスペース'};}
const contextChats={};
function contextAnswer(prompt,ctx){if(ctx.d){const d=ctx.d,ms=db.meetings.filter(m=>m.deal===d.id),ts=db.tasks.filter(t=>t.dealId===d.id&&t.status!=='done'),acts=db.activities.filter(a=>a.dealId===d.id);if(prompt.includes('資料')||prompt.includes('履歴'))return `<p>この案件には${acts.length}件の活動があります。</p>${acts.slice(0,3).map(a=>`<div class="section-gap">${link(a.title,'activity/'+a.id)}</div>`).join('')}`;return `<p>${e(company(d.company).name)}の案件は「${e(d.stage)}」、${yen(d.amount)}です。未完了タスクは${ts.length}件です。</p>${ms.slice(0,2).map(m=>`<div class="section-gap"><b>${e(m.name)}</b><p>${phaseLabel(m.phase)}</p>${link('次のアクションを開く','meeting/'+m.id+'/brief')}</div>`).join('')}${!ms.length?`<div class="section-gap">${link('案件の活動を見る','deal/'+d.id+'/activities')}</div>`:''}`}return `<p>タスクと案件データを確認できます。</p><div class="section-gap">${link('タスクを見る','tasks')}</div><div class="section-gap">${link('案件を見る','deals')}</div><div class="section-gap">${link('ホームで質問する','chat')}</div>`;}
function contextPanel(){const ctx=contextRecord(),messages=contextChats[ctx.key]||[];return `<aside class="context-ai"><div class="card-head"><h2>AIアシスタント</h2><button class="btn small" data-action="toggle-assistant">閉じる</button></div><div class="pad small muted">${e(ctx.label)}</div><div class="context-messages">${messages.map(m=>`<div class="context-message ${m.role}">${m.role==='user'?e(m.text):m.html}</div>`).join('')}</div><form class="pad" id="context-form"><div class="context-tools"><button class="btn small" type="button" data-context-prompt="この案件の次の対応を教えて。">次の対応</button><button class="btn small" type="button" data-context-prompt="関連する資料を見せて。">関連資料</button></div><label class="visually-hidden" for="context-input">AIへの依頼</label><textarea id="context-input">${ctx.d?'この案件の次の対応を教えて。':'確認する仕事を教えて。'}</textarea><div class="actions"><button class="btn primary" type="submit">送信</button></div></form></aside>`;}
const renderUnified=render;
render=function(){renderUnified();if(route!=='chat'){const contents=$('#main').innerHTML;$('#main').innerHTML=(assistantOpen?'':'<div class="context-toggle"><button class="btn small" data-action="toggle-assistant">AIアシスタント</button></div>')+(assistantOpen?`<div class="workbench"><section>${contents}</section>${contextPanel()}</div>`:contents)}const [page,id]=route.split('/'),m=page==='meeting'?meeting(id):null;if(m&&['preparing','drafting'].includes(m.phase)){$('#complete-demo').hidden=false;$('#complete-demo').dataset.action='lifecycle-tick:'+id}else $('#complete-demo').dataset.action='finish-run';};
document.addEventListener('change',ev=>{if(ev.target.id==='needs-my-action'){needsMyAction=ev.target.checked;render()}});
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(b?.dataset.contextPrompt){$('#context-input').value=b.dataset.contextPrompt;$('#context-input').focus()}});
document.addEventListener('submit',ev=>{if(ev.target.id==='context-form'){ev.preventDefault();const prompt=$('#context-input').value.trim();if(!prompt)return;const ctx=contextRecord();contextChats[ctx.key]||=[];contextChats[ctx.key].push({role:'user',text:prompt},{role:'assistant',html:contextAnswer(prompt,ctx)});render()}else if(ev.target.id==='meeting-note-form'){ev.preventDefault();const m=meeting(ev.target.dataset.meeting),note=$('#meeting-notes').value,title=$('#next-task').value.trim();m.notes=note;if(title){const id='task-'+(++entitySequence);db.tasks.push({id,title,owner:m.owner||'akane',executionMode:'human',kind:'次の対応',company:deal(m.deal).company,dealId:m.deal,due:'10/28',status:'open',route:'task/'+id})}const aid='note-'+m.id;if(note.trim()){db.activities=db.activities.filter(a=>a.id!==aid);db.activities.unshift({id:aid,company:deal(m.deal).company,dealId:m.deal,meeting:m.id,title:m.name+'の記録',date:m.date,type:'商談記録',body:note})}toast('活動に記録しました');render()}});render();

$('#reset-demo').addEventListener('click',()=>{needsMyAction=false;assistantOpen=true;Object.keys(contextChats).forEach(k=>delete contextChats[k]);render()});
</script></body></html>
