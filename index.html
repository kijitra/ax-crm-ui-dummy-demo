ue:'10/26',status:'open',route:'deal/d1'},{id:'t3',title:'北辰物流の予算感を確認',kind:'情報の確認',company:'c2',due:'10/26',status:'open',route:'task/t3'},{id:'t4',title:'光和商事へヒアリング日程を連絡',kind:'自分のタスク',company:'c3',due:'10/27',status:'open',route:'task/t4'},{id:'t5',title:'青葉製作所の商談準備',kind:'準備資料の確認',company:'c1',due:'10/27',status:'done',route:'meeting/m1/brief'}],flow:{name:'商談準備',target:'自分が担当する翌日の商談',trigger:'毎営業日 06:00',context:'顧客情報・案件・直近3件の活動履歴',policy:'review',enabled:true},run:{id:'r1',status:'running',step:2,meeting:'m2',policy:'review'}};

let db=structuredClone(initial),route='tasks',filter='open',editing=false,search='',toastTimer;let dealView='kanban',entitySequence=0;

function related(c,d){return `<aside class="related">${card('顧客',`<div class="listline">${link(c.name,'customer/'+c.id)}<div class="small muted">${e(c.person)}</div></div>`)}${d?card('案件',`<div class="listline">${link(d.name,'deal/'+d.id)}<div class="small muted">${e(d.stage)} · ${yen(d.amount)}</div></div>`):''}${card('関連する活動',db.activities.filter(x=>d?x.dealId===d.id:x.company===c.id).map(a=>`<div class="listline">${link(a.title,'activity/'+a.id)}<div class="small muted">${e(a.date)} · ${a.type}</div></div>`).join('')||'<div class="pad muted">活動はありません</div>')}</aside>`}
function taskRows(tasks){return tasks.map(t=>`<div class="task"><div class="task-symbol">${icon('tasks')}</div><div><div class="task-title">${link(t.title,t.route)}</div><div class="task-meta">${e(company(t.company).name)}<span>·</span>${e(t.kind)}<span>·</span>${e(t.due)}</div></div><div class="task-actions">${badge(t.status==='done'?'完了':'ToDo',t.status==='done'?'green':'')}${`<button class="btn small" data-go="${t.route}">${t.kind.includes('確認')?'確認する':'開く'}</button>`}</div></div>`).join('')||'<div class="empty">タスクはありません</div>'}
function tasksPage(){const open=db.tasks.filter(t=>t.status==='open'),done=db.tasks.filter(t=>t.status==='done');return heading('タスク','10月26日（月）',badge('akane'))+`<div class="tabs" role="tablist">${[['open','自分のタスク',open.length],['running','進行中',db.run.status==='running'?1:0],['done','完了',done.length]].map(([id,label,n])=>`<button data-filter="${id}" class="${filter===id?'active':''}" role="tab" aria-selected="${filter===id}">${label}<span class="count">${n}</span></button>`).join('')}</div>`+(filter==='running'?card('依頼した仕事',`<div class="task"><div class="task-symbol">${icon('flows')}</div><div><div class="task-title">北辰物流の商談準備</div><div class="task-meta">${db.run.status==='running'?'活動履歴を取得中 · 2 / 4':'停止または完了'}</div></div><button class="btn small" data-go="run/r1">進捗を見る</button></div>`):card(filter==='done'?'完了したタスク':'対応すること',taskRows(filter==='done'?done:open)))+`<div class="row between small muted"><span>商談予定</span>${link('すべての商談','meetings')}</div><div class="card section-gap">${db.meetings.map(m=>`<div class="listline row between"><div>${link(m.name,'meeting/'+m.id+'/brief')}<div class="small muted">${company(deal(m.deal).company).name}</div></div><span class="small">${m.date.slice(5)}</span></div>`).join('')}</div>`}
function dashboard(){const inPeriod=d=>d.close>=db.goal.start&&d.close<=db.goal.end,period=db.deals.filter(inPeriod),won=period.filter(d=>d.stage==='受注'),open=period.filter(d=>d.stage!=='受注'),actual=won.reduce((n,d)=>n+d.amount,0),pipeline=open.reduce((n,d)=>n+d.amount,0),stages=['ヒアリング','提案中','受注'],max=Math.max(1,...stages.map(s=>period.filter(d=>d.stage===s).reduce((n,d)=>n+d.amount,0)));return heading('ダッシュボード','2026年10月1日 — 12月31日')+`<div class="summary-grid"><div class="stat"><span>受注目標</span><strong>${db.goal.amount/10000}<small> 万円</small></strong></div><div class="stat"><span>受注実績</span><strong>${actual/10000}<small> 万円</small></strong><div class="small muted">${won.length}件 · 目標達成率 ${Math.round(actual/db.goal.amount*100)}%</div></div><div class="stat"><span>進行中の案件金額</span><strong>${pipeline/10000}<small> 万円</small></strong><div class="small muted">${open.length}件</div></div></div>${card('目標に対する受注実績',`<div class="pad"><div class="row between small" style="margin-bottom:14px"><b>${actual/10000}万円 / ${db.goal.amount/10000}万円</b><span>${Math.round(actual/db.goal.amount*100)}%</span></div><div class="bar"><i style="width:${Math.min(100,actual/db.goal.amount*100)}%"></i></div></div>`)}${card('ステージ別の案件金額',`<div class="pad">${stages.map(stage=>{let ds=period.filter(d=>d.stage===stage),amount=ds.reduce((n,d)=>n+d.amount,0);return `<div class="bar-row" style="grid-template-columns:110px 1fr 120px"><span>${stage} · ${ds.length}件</span><div class="bar"><i style="width:${amount/max*100}%"></i></div><span>${amount/10000}万円</span></div>`}).join('')}</div>`,link('案件を見る','deals'))}`}

function originalListPage(type){let title,headers,rows;if(type==='customers'){title='顧客';headers=['会社名','担当窓口','業種','担当'];rows=db.companies.map(c=>[link(c.name,'customer/'+c.id),e(c.person),e(c.industry),'akane'])}else if(type==='deals'){title='案件';headers=['案件名','顧客','進捗','案件金額','受注予定日'];rows=db.deals.map(d=>[link(d.name,'deal/'+d.id),e(company(d.company).name),badge(d.stage),yen(d.amount),e(d.close)])}else{title='商談・活動';headers=['件名','顧客','日時','種類'];rows=db.meetings.map(m=>[link(m.name,'meeting/'+m.id+'/brief'),e(company(deal(m.deal).company).name),m.date,'商談予定']).concat(db.activities.map(a=>[link(a.title,'activity/'+a.id),e(company(a.company).name),a.date,a.type]))}return heading(title)+`<div class="card table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function listPage(type){if(type==='customers')return originalListPage(type);if(type==='deals'){const list=dealView==='list';return heading('案件','',`<div class="row"><button class="btn small ${!list?'primary':''}" data-action="view-kanban">カンバン</button><button class="btn small ${list?'primary':''}" data-action="view-list">一覧</button></div>`)+(list?`<div class="card table-wrap"><table><thead><tr><th>案件名</th><th>顧客</th><th>ステージ</th><th>金額</th><th>受注予定日</th></tr></thead><tbody>${db.deals.map(d=>`<tr><td>${link(d.name,'deal/'+d.id)}</td><td>${e(company(d.company).name)}</td><td>${badge(d.stage)}</td><td>${yen(d.amount)}</td><td>${d.close}</td></tr>`).join('')}</tbody></table></div>`:`<div class="kanban">${['ヒアリング','提案中','受注'].map(stage=>{const ds=db.deals.filter(d=>d.stage===stage);return `<section class="kanban-col"><div class="kanban-heading"><b>${stage}<span class="count">${ds.length}件</span></b><div class="muted small">${yen(ds.reduce((n,d)=>n+d.amount,0))}</div></div>${ds.map(d=>{const next=db.tasks.find(t=>t.dealId===d.id&&t.status==='open');return `<article class="deal-card"><div class="deal-card-title">${link(d.name,'deal/'+d.id)}</div><div class="small muted">${e(company(d.company).name)}</div><div class="row between section-gap"><b>${yen(d.amount)}</b><span class="small muted">${d.close.slice(5).replace('-','/')}</span></div>${next?`<div class="next-task small">${link(next.title,next.route)}</div>`:''}</article>`}).join('')}</section>`}).join('')}</div>`)}return heading('活動')+db.companies.map(c=>{let entries=[...db.activities.filter(a=>a.company===c.id).map(a=>({title:a.title,date:a.date,dealId:a.dealId,type:a.type,to:'activity/'+a.id})),...db.meetings.filter(m=>deal(m.deal).company===c.id).map(m=>({title:m.name,date:m.date,dealId:m.deal,type:'打ち合わせ',to:'meeting/'+m.id+'/brief'}))].sort((a,b)=>b.date.localeCompare(a.date));return card(c.name,entries.map(a=>`<div class="listline row between"><div>${link(a.title,a.to)}<div class="small muted">${a.dealId?e(deal(a.dealId).name):'顧客全体'} · ${a.type}</div></div><span class="small muted">${a.date}</span></div>`).join('')||'<div class="pad muted">活動はありません</div>')}).join('')}
function customerPage(id){let c=company(id);return crumb('顧客','customers',c.name)+heading(c.name)+props([['窓口',e(c.person)],['メール',e(c.email)],['業種',e(c.industry)],['担当','akane']])+`<div class="detail-cols"><div>${card('顧客の状況',`<div class="pad"><p>${e(c.summary)}</p>${sources(db.activities.filter(a=>a.company===id).map(a=>a.id))}</div>`)}${card('案件',db.deals.filter(d=>d.company===id).map(d=>`<div class="listline row between">${link(d.name,'deal/'+d.id)}${badge(d.stage)}</div>`).join(''))}${card('活動履歴',db.activities.filter(a=>a.company===id).map(a=>`<div class="listline">${link(a.title,'activity/'+a.id)}<div class="small muted">${a.date} · ${a.type}</div></div>`).join('')||'<div class="pad muted">活動はありません</div>')}</div><aside class="related">${card('ToDoのタスク',db.tasks.filter(t=>t.company===id&&t.status==='open').map(t=>`<div class="listline">${link(t.title,t.route)}<div class="small muted">${e(t.due)} · ${e(t.kind)}</div></div>`).join('')||'<div class="pad muted">ToDoのタスクはありません</div>')}${card('商談予定',db.meetings.filter(m=>deal(m.deal).company===id).map(m=>`<div class="listline">${link(m.name,'meeting/'+m.id+'/brief')}<div class="small muted">${m.date}</div></div>`).join('')||'<div class="pad muted">商談予定はありません</div>')}</aside></div>`}
function dealPage(id,tab='activities'){const d=deal(id),c=company(d.company),p=db.proposal;const actions=[['memo','メモ'],['email','メール'],['task','タスク'],['meeting','打ち合わせ']];const prop=editing?`<form id="deal-properties" data-deal="${id}"><div class="field"><label for="prop-name">案件名</label><input id="prop-name" required value="${e(d.name)}"></div><div class="field"><label for="prop-stage">ステージ</label><select id="prop-stage">${['ヒアリング','提案中','受注'].map(x=>`<option ${x===d.stage?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="prop-amount">案件金額（円）</label><input id="prop-amount" type="number" min="0" required value="${d.amount}"></div><div class="field"><label for="prop-close">受注予定日</label><input id="prop-close" type="date" required value="${d.close}"></div><div class="actions">${btn('戻る','cancel-edit')}<button class="btn primary" type="submit">保存</button></div></form>`:`<dl class="record-props"><dt>ステージ</dt><dd>${badge(d.stage)}</dd><dt>案件金額</dt><dd>${yen(d.amount)}</dd><dt>受注予定日</dt><dd>${e(d.close)}</dd><dt>担当</dt><dd>akane</dd></dl><div class="section-gap">${btn('編集','edit')}</div>`;const proposal=id==='d1'&&p.status==='pending'?card('受注予定日の更新案',`<div class="pad"><p>山田さんのメールでは、導入判断は11月中の予定です。</p><div class="diff"><div><small>現在</small>${e(d.close)}</div><span>→</span><div><small>変更案</small>${p.after}</div></div>${sources(['a2'])}<div class="actions">${btn('採用しない','reject-update')}${btn('更新する','accept-update',true)}</div></div>`,badge('確認待ち','amber')):'';let content;if(actions.some(([a])=>a===tab))content=composeForm(d,tab);else if(tab==='overview')content=card('概要',`<div class="pad"><p>${e(d.description||(id==='d4'?'受注業務の現状整理ワークショップ。成果物を共有して完了。':c.summary))}</p>${sources(db.activities.filter(a=>a.dealId===id&&a.type==='商談記録').map(a=>a.id))}</div>`);else content=dealTimeline(d);return crumb('案件','deals',d.name)+heading(d.name)+`<div class="record-grid"><aside>${card('案件情報',`<div class="pad">${prop}</div>`)}</aside><div><div class="tabs"><button class="${tab==='overview'?'active':''}" data-go="deal/${id}/overview">概要</button><button class="${tab!=='overview'?'active':''}" data-go="deal/${id}/activities">活動</button></div><div class="row activity-actions">${actions.map(([key,label])=>`<button class="btn small ${tab===key?'primary':''}" data-go="deal/${id}/${key}">${label}</button>`).join('')}</div>${proposal}${content}</div><aside>${card('顧客',`<div class="listline">${link(c.name,'customer/'+c.id)}</div>`)}${card('担当窓口',`<div class="listline"><b>${e(c.person)}</b><div class="small muted email-address">${e(c.email)}</div></div>`)}</aside></div>`}
function dealTimeline(d){const upcoming=[...db.meetings.filter(m=>m.deal===d.id).map(m=>({title:m.name,date:m.date,type:'打ち合わせ',to:'meeting/'+m.id+'/brief'})),...db.tasks.filter(t=>t.dealId===d.id&&t.status==='open').map(t=>({title:t.title,date:'2026-'+t.due.replace('/','-'),type:'ToDo',to:t.route}))].sort((a,b)=>a.date.localeCompare(b.date));const history=db.activities.filter(a=>a.dealId===d.id).sort((a,b)=>b.date.localeCompare(a.date));return card('予定・ToDo',upcoming.map(a=>`<div class="listline"><div class="row between">${badge(a.type)}<span class="small muted">${e(a.date)}</span></div><div style="margin-top:8px">${link(a.title,a.to)}</div></div>`).join('')||'<div class="pad muted">予定はありません</div>')+card('活動履歴',history.map(a=>`<div class="listline"><div class="row between">${badge(a.type)}<span class="small muted">${a.date}</span></div><h3 style="margin:10px 0 6px">${link(a.title,'activity/'+a.id)}</h3><div class="small muted excerpt">${e(a.body)}</div></div>`).join('')||'<div class="pad muted">活動はありません</div>')}
function composeForm(d,type){const names={memo:'メモを残す',email:'メールを書く',task:'タスクを作る',meeting:'打ち合わせを登録'};return card(names[type],`<form id="compose-form" data-deal="${d.id}" data-kind="${type}" class="pad">${type==='email'?`<div class="small muted" style="margin-bottom:18px">宛先：${e(company(d.company).person)} &lt;${e(company(d.company).email)}&gt;</div>`:''}<div class="field"><label for="compose-title">${type==='email'?'件名':'タイトル'}</label><input id="compose-title" required></div>${['memo','email'].includes(type)?'<div class="field"><label for="compose-body">内容</label><textarea id="compose-body" required></textarea></div>':''}${['task','meeting'].includes(type)?`<div class="field"><label for="compose-date">${type==='task'?'期限':'日時'}</label><input id="compose-date" type="${type==='task'?'date':'datetime-local'}" required value="${type==='task'?'2026-10-27':'2026-10-27T14:00'}"></div>`:''}<div class="actions"><button class="btn" type="button" data-go="deal/${d.id}/activities">キャンセル</button><button class="btn primary" type="submit">${type==='email'?'下書きを保存':'保存'}</button></div></form>`)}

function meetingPage(id,tab='brief'){const m=meeting(id),d=deal(m.deal),c=company(d.company);let content='';if(tab==='brief'){content=!m.prepared?`<div class="card empty"><h2 style="color:var(--ink)">準備資料はまだありません</h2>${btn('商談準備を実行','prepare:'+id,true)}</div>`:card('商談準備資料',`<div class="pad">${editing?`<textarea id="brief-edit" style="min-height:310px">${e(m.brief)}</textarea><div class="actions">${btn('キャンセル','cancel-edit')}${btn('保存','save-brief:'+id,true)}</div>`:`<div class="prose">${e(m.brief)}</div>${sources(m.sourceIds||[])}<div class="actions">${btn('編集する','edit')}${m.reviewed?badge('確認済み','green'):btn('確認済みにする','review-brief:'+id,true)}</div>`}</div>`)}else if(tab==='mail'){content=db.mails[id]?card(db.mails[id].status==='sent'?'送信済みメール':'下書き',`<div class="pad"><div class="small muted" style="margin-bottom:18px">宛先：${e(c.person)} &lt;${e(c.email)}&gt;</div>${editing?`<div class="field"><label for="mail-subject">件名</label><input id="mail-subject" value="${e(db.mails[id].subject)}"></div><textarea id="mail-body" style="min-height:280px">${e(db.mails[id].body)}</textarea><div class="actions">${btn('キャンセル','cancel-edit')}${btn('下書きを保存','save-mail',true)}</div>`:`<h3 style="margin-bottom:18px">${e(db.mails[id].subject)}</h3><div class="prose">${e(db.mails[id].body)}</div>${sources(db.mails[id].sourceIds||[])}${db.mails[id].status==='draft'?`<div class="actions">${btn('編集する','edit')}${btn('内容を確認して送信','send-mail',true)}</div>`:''}`}</div>`,badge(db.mails[id].status==='sent'?'送信済み':'送信前',db.mails[id].status==='sent'?'green':'amber')):card('メール','<div class="pad muted">下書きはありません</div>');content+=card('メール履歴',db.activities.filter(a=>a.company===c.id&&a.type.includes('メール')).map(a=>`<div class="listline">${link(a.title,'activity/'+a.id)}<div class="small muted">${a.date} · ${a.type}</div></div>`).join('')||'<div class="pad muted">メールはありません</div>')}else{content=card('商談記録',`<div class="pad"><div class="field"><label for="meeting-notes">議事録</label><textarea id="meeting-notes" placeholder="決まったこと・確認したこと">${e(m.notes)}</textarea></div><div class="field"><label for="next-task">次の対応</label><input id="next-task" placeholder="例：現行の受注CSVを確認する"></div><div class="actions">${btn('記録を保存','save-notes:'+id,true)}</div></div>`)}return crumb('活動','meetings',m.name)+heading(m.name,'',m.prepared?badge('準備済み','green'):'')+props([['日時',m.date],['顧客',link(c.name,'customer/'+c.id)],['担当','akane'],['案件',link(d.name,'deal/'+d.id)]])+`<div class="detail-cols"><div><div class="tabs">${[['brief','準備資料'],['mail','メール'],['notes','商談記録']].map(([k,t])=>`<button data-go="meeting/${id}/${k}" class="${tab===k?'active':''}">${t}</button>`).join('')}</div>${content}</div><aside class="related">${card('業務フロー',`<div class="listline">${link('商談準備','flow/f1')}</div>`)}${card('関連する活動',db.activities.filter(a=>a.dealId===d.id).map(a=>`<div class="listline">${link(a.title,'activity/'+a.id)}<div class="small muted">${a.date}</div></div>`).join('')||'<div class="pad muted">活動はありません</div>')}</aside></div>`}
function activityPage(id){const a=db.activities.find(a=>a.id===id),c=company(a.company),d=a.dealId?deal(a.dealId):null;const draft=a.type==='メール下書き';return crumb(d?'案件':'活動',d?'deal/'+d.id+'/activities':'meetings',a.title)+heading(a.title)+props([['日時',a.date],['種類',a.type],['顧客',link(c.name,'customer/'+c.id)],['案件',d?link(d.name,'deal/'+d.id):'顧客全体']])+`<div class="detail-cols">${card(a.type,draft?`<form id="draft-form" data-activity="${id}" class="pad"><div class="small muted" style="margin-bottom:18px">宛先：${e(c.email)}</div><div class="field"><label for="draft-title">件名</label><input id="draft-title" required value="${e(a.title)}"></div><div class="field"><label for="draft-body">本文</label><textarea id="draft-body" required>${e(a.body)}</textarea></div><div class="actions"><button class="btn" type="submit" name="mode" value="save">下書きを保存</button><button class="btn primary" type="submit" name="mode" value="send">内容を確認して送信</button></div></form>`:`<div class="pad">${a.meeting?`<div class="small muted" style="margin-bottom:18px">関連する打ち合わせ：${link(meeting(a.meeting).name,'meeting/'+a.meeting+'/mail')}</div>`:''}<div class="prose">${e(a.body)}</div></div>`)}${related(c,d)}</div>`}
function taskPage(id){const t=db.tasks.find(t=>t.id===id),c=company(t.company);return crumb('タスク','tasks',t.title)+heading(t.title,'',badge(t.status==='done'?'完了':'ToDo',t.status==='done'?'green':''))+props([['期限',e(t.due)],['担当','akane'],['顧客',link(c.name,'customer/'+c.id)],['種類',e(t.kind)]])+`<div class="detail-cols"><div>${card('対応内容',`<div class="pad"><p>${id==='t3'?'問い合わせには費用感の相談がありますが、予算の記録がありません。次回ヒアリングで確認してください。':id==='t4'?'ヒアリング候補日を確認して、高橋さんに連絡する。':e(t.title)}</p>${id==='t3'?sources(['a3']):''}<div class="field section-gap"><label for="task-note">対応結果</label><textarea id="task-note" placeholder="確認できたことを記録">${e(t.note||'')}</textarea></div>${t.status==='open'?`<div class="actions">${btn('記録して完了','complete-task:'+id,true)}</div>`:''}</div>`)}</div>${related(c)}</div>`}
function flowsPage(){return heading('業務フロー')+card('フロー一覧',`<div class="task"><div class="task-symbol">${icon('flows')}</div><div><div class="task-title">${link(db.flow.name,'flow/f1')}</div><div class="task-meta">${e(db.flow.target)} · ${e(db.flow.trigger)}</div></div>${badge(db.flow.enabled?'有効':'停止中',db.flow.enabled?'green':'')}</div>`)}
function flowPage(){const f=db.flow;return crumb('業務フロー','flows',f.name)+heading(f.name,'',`<div class="row">${badge(f.enabled?'有効':'停止中',f.enabled?'green':'')}${btn(f.enabled?'一時停止':'再開','toggle-flow')}</div>`)+`<div class="workflow-grid"><div>${card('手順',`<div class="flow">${[['対象の商談を取得',f.target],['顧客・案件・活動履歴を取得',f.context],['準備資料とメール下書きを作成','参照した活動を成果物に紐づける'],['担当者へ引き渡す',f.policy==='review'?'確認タスクを作成':'準備資料を保存']].map(([t,s],i)=>`${i?'<div class="connector"></div>':''}<div class="node"><b>${t}</b><div class="small muted">${e(s)}</div></div>`).join('')}</div>`)}${card('実行履歴',`<div class="listline row between">${link('北辰物流の商談準備','run/r1')}${badge(db.run.status==='running'?'進行中':db.run.status==='done'?'完了':'停止',db.run.status==='running'?'blue':'')}</div>`)}</div><div>${card('自動実行の設定',`<form id="flow-form" class="pad"><div class="field"><label for="flow-target">対象</label><select id="flow-target"><option ${f.target.includes('翌日')?'selected':''}>自分が担当する翌日の商談</option><option ${f.target.includes('当日')?'selected':''}>自分が担当する当日の商談</option></select></div><div class="field"><label for="flow-trigger">実行するタイミング</label><select id="flow-trigger"><option ${f.trigger.includes('06')?'selected':''}>毎営業日 06:00</option><option ${f.trigger.includes('18')?'selected':''}>毎営業日 18:00</option></select></div><div class="field"><label for="flow-policy">成果物の確認</label><select id="flow-policy"><option value="review" ${f.policy==='review'?'selected':''}>確認タスクを作成する</option><option value="save" ${f.policy==='save'?'selected':''}>資料保存のみ</option></select></div><div class="field"><label>実行を許可する操作</label><div class="small">✓ 顧客・案件・活動の参照<br>✓ 商談への資料保存<br>✓ メール下書きの作成</div></div><div class="actions"><button class="btn primary" type="submit">設定を保存</button></div></form>`)}<button class="btn" data-action="sample-run" ${f.enabled?'':'disabled'}>サンプル商談で試す</button></div></div>`}
function runPage(){const r=db.run,m=meeting(r.meeting),c=company(deal(m.deal).company);return crumb('タスク','tasks',c.name+'の商談準備')+heading(c.name+'の商談準備','',badge(r.status==='running'?'進行中':r.status==='done'?'完了':'停止',r.status==='running'?'blue':r.status==='done'?'green':''))+props([['対象の商談',link(m.name,'meeting/'+m.id+'/brief')],['業務フロー',link('商談準備','flow/f1')],['実行方法','自動実行'],['担当','akane']])+card('進捗',`<ol class="steps">${['対象の商談を取得','顧客・案件・活動履歴を取得','準備資料を作成','成果物を保存'].map((s,i)=>`<li><span class="task-symbol">${i<r.step?'✓':i+1}</span><span>${s}</span>${r.status==='running'&&i===r.step?badge('処理中','blue'):''}</li>`).join('')}</ol>`)+`<div class="row">${r.status==='running'?btn('実行を停止','stop-run'):''}${r.status==='done'?`<button class="btn primary" data-go="meeting/${m.id}/brief">準備資料を開く</button>`:''}</div>`}
function render(){const [page,id,tab]=route.split('/');$('#complete-demo').hidden=!(page==='run'&&db.run.status==='running');const active=({customer:'customers',deal:'deals',meeting:'meetings',activity:'meetings',task:'tasks',run:'tasks',flow:'flows'})[page]||page;$('#nav').innerHTML=[['dashboard','ダッシュボード'],['tasks','タスク'],['customers','顧客'],['deals','案件'],['meetings','活動'],['flows','業務フロー']].map(([k,v])=>`<button data-go="${k}" class="${active===k?'active':''}" ${active===k?'aria-current="page"':''}>${icon(k)}${v}</button>`).join('');$('#main').innerHTML=page==='tasks'?tasksPage():page==='dashboard'?dashboard():['customers','deals','meetings'].includes(page)?listPage(page):page==='customer'?customerPage(id):page==='deal'?dealPage(id,tab):page==='meeting'?meetingPage(id,tab):page==='activity'?activityPage(id):page==='task'?taskPage(id):page==='flows'?flowsPage():page==='flow'?flowPage():runPage()}
function complete(id){const t=db.tasks.find(t=>t.id===id);if(t)t.status='done'}
function prepare(id){const m=meeting(id);m.prepared=true;m.sourceIds=db.activities.filter(a=>a.dealId===m.deal).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3).map(a=>a.id);if(!db.mails[id])db.mails[id]={subject:'次回のお打ち合わせについて',body:company(deal(m.deal).company).person+'様\n\nお世話になっております。キジトラのakaneです。\n次回は現在の管理表、対応履歴の共有方法とご予算の目安をお伺いできればと思います。\n\nよろしくお願いいたします。',status:'draft',sourceIds:[...m.sourceIds]};m.brief=id==='m1'?initial.meetings[0].brief:'今回の打ち合わせ\n'+m.name+'\n\n案件\n'+deal(m.deal).name+'\n\n確認すること\n・対象の業務と現状の進め方\n・導入時期と予算感\n\nこれまでの記録\n'+m.sourceIds.map(aid=>db.activities.find(a=>a.id===aid).body).join('\n\n');}
document.addEventListener('click',ev=>{const el=ev.target.closest('button');if(!el)return;if(el.dataset.go){go(el.dataset.go);return}if(el.dataset.filter){filter=el.dataset.filter;render();return}const [a,id]=(el.dataset.action||'').split(':');if(!a)return;switch(a){case'view-kanban':dealView='kanban';break;case'view-list':dealView='list';break;case'edit':editing=true;break;case'cancel-edit':editing=false;break;case'save-brief':meeting(id).brief=$('#brief-edit').value;editing=false;toast('準備資料を保存しました');break;case'review-brief':meeting(id).reviewed=true;db.tasks.filter(t=>t.route==='meeting/'+id+'/brief').forEach(t=>t.status='done');toast('確認済みにしました');break;case'save-mail':activeMail().subject=$('#mail-subject').value;activeMail().body=$('#mail-body').value;editing=false;toast('下書きを保存しました');break;case'send-mail':{const mid=route.split('/')[1],mail=activeMail();if(!mail||mail.status!=='draft')break;mail.status='sent';const aid='sent-'+mid;db.activities.unshift({id:aid,company:deal(meeting(mid).deal).company,dealId:meeting(mid).deal,meeting:mid,title:mail.subject,date:'2026-10-26 09:00',type:'送信メール',body:mail.body});if(mid==='m1')complete('t1');toast('デモ内で送信済みにしました（実際の送信はありません）');break;}case'accept-update':deal('d1').close=db.proposal.after;db.proposal.status='accepted';complete('t2');toast('受注予定日を更新しました');break;case'reject-update':db.proposal.status='rejected';complete('t2');toast('更新案を採用しませんでした');break;case'prepare':prepare(id);toast('商談に準備資料を保存しました');break;case'save-notes':{const m=meeting(id);m.notes=$('#meeting-notes').value;const title=$('#next-task').value.trim();if(title){const tid='t'+(db.tasks.length+1);db.tasks.push({id:tid,title,kind:'自分のタスク',company:deal(m.deal).company,dealId:m.deal,due:'10/28',status:'open',route:'task/'+tid})}if(m.notes.trim()){const aid='note-'+id;db.activities=db.activities.filter(a=>a.id!==aid);db.activities.unshift({id:aid,company:deal(m.deal).company,dealId:m.deal,title:m.name+'の記録',date:m.date,type:'商談記録',body:m.notes})}toast(title?'商談記録と次のタスクを保存しました':'商談記録を保存しました');break}case'complete-task':{const t=db.tasks.find(t=>t.id===id);t.note=$('#task-note').value;complete(id);toast('対応結果を記録しました');break}case'toggle-flow':db.flow.enabled=!db.flow.enabled;toast(db.flow.enabled?'自動実行を再開しました':'次回からの自動実行を停止しました');break;case'sample-run':db.run.status='running';db.run.step=2;db.run.policy=db.flow.policy;route='run/r1';break;case'stop-run':db.run.status='stopped';toast('実行を停止しました');break;case'finish-run':db.run.status='done';db.run.step=4;prepare('m2');meeting('m2').reviewed=false;if(db.run.policy==='review'&&db.tasks.some(t=>t.id==='review-m2'))db.tasks.find(t=>t.id==='review-m2').status='open';if(db.run.policy==='review'&&!db.tasks.some(t=>t.id==='review-m2'))db.tasks.push({id:'review-m2',title:'北辰物流の商談準備資料',kind:'準備資料の確認',company:'c2',dealId:'d2',due:'10/27',status:'open',route:'meeting/m2/brief'});toast(db.run.policy==='review'?'資料を保存し、確認タスクを追加しました':'商談に準備資料を保存しました');break}render()});
document.addEventListener('submit',ev=>{if(ev.target.id!=='flow-form')return;ev.preventDefault();db.flow.target=$('#flow-target').value;db.flow.trigger=$('#flow-trigger').value;db.flow.policy=$('#flow-policy').value;render();toast('自動実行の設定を保存しました')});$('#reset-demo').addEventListener('click',()=>{db=structuredClone(initial);route='tasks';filter='open';editing=false;render();toast('最初の状態に戻しました')});render();

document.addEventListener('submit',ev=>{const form=ev.target;if(form.id==='draft-form'){ev.preventDefault();const a=db.activities.find(x=>x.id===form.dataset.activity);if(a.type!=='メール下書き')return;a.title=$('#draft-title').value;a.body=$('#draft-body').value;if(ev.submitter?.value==='send'){a.type='送信メール';toast('デモ内で送信済みにしました')}else toast('下書きを保存しました');render();return}if(form.id==='deal-properties'){ev.preventDefault();const d=deal(form.dataset.deal);d.name=$('#prop-name').value.trim();d.stage=$('#prop-stage').value;d.amount=Number($('#prop-amount').value);d.close=$('#prop-close').value;editing=false;render();toast('案件情報を保存しました');return}if(form.id!=='compose-form')return;ev.preventDefault();const d=deal(form.dataset.deal),kind=form.dataset.kind,title=$('#compose-title').value.trim(),id='new-'+Date.now()+'-'+(++entitySequence),date=$('#compose-date')?.value;if(kind==='task'){db.tasks.push({id,title,kind:'自分のタスク',company:d.company,dealId:d.id,due:date.slice(5).replace('-','/'),status:'open',route:'task/'+id});go('deal/'+d.id+'/activities')}else if(kind==='meeting'){db.meetings.push({id,deal:d.id,name:title,date:date.replace('T',' '),prepared:false,reviewed:false,brief:'',notes:''});go('deal/'+d.id+'/activities')}else{db.activities.unshift({id,company:d.company,dealId:d.id,title,date:'2026-10-26 09:00',type:kind==='email'?'メール下書き':'メモ',body:$('#compose-body').value});go(kind==='email'?'activity/'+id:'deal/'+d.id+'/activities')}toast('保存しました')});
</script></body></html>
