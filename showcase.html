<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>業務画面イメージ｜撮影用</title><style>
:root{--blue:#2563eb;--ink:#262626;--muted:#727781;--line:#e5e7eb;--wash:#fafafa}*{box-sizing:border-box}body{margin:0;font:13px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--ink);background:white}h1,h2,h3,p{margin:0}h1{font-size:24px;letter-spacing:-.03em}h2{font-size:15px}h3{font-size:13px;font-weight:600}a{color:inherit;text-decoration:none}a:focus-visible{outline:2px solid #93b4f7;outline-offset:3px}a:hover{background:#eee}.icon{width:18px;height:18px;flex-shrink:0;vertical-align:middle}.shell{min-height:100dvh;display:grid;grid-template-columns:190px minmax(0,1fr) 292px}.sidebar{border-right:1px solid var(--line);background:#fafafa;padding:24px 12px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:650;padding:0 6px 30px}.brand-mark{width:30px;height:30px;display:grid;place-items:center;background:#18181b;color:white;border-radius:7px}.nav-item{display:flex;gap:11px;align-items:center;padding:9px 12px;color:#616773;border-radius:7px;margin-bottom:4px}.nav-item.active{background:#eaeaec;color:#222;font-weight:600}.sidebar-foot{margin-top:auto;padding-top:24px}.switches{display:flex;gap:5px}.switches a{padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:11px}.readonly{font-size:10px;color:#818691;margin:12px 0}.user{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:18px 6px 0}.avatar{width:25px;height:25px;display:inline-grid;place-items:center;background:#f0f0f2;border-radius:50%;font-size:9px;color:#555;font-weight:500;flex-shrink:0}.main{padding:28px;min-width:0;background:white}.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.period{font-size:12px;color:var(--muted)}.muted{color:var(--muted)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.filter-label{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:white;color:#555;font-size:12px}.tabs{display:flex;border-bottom:1px solid var(--line);gap:22px;margin-bottom:20px}.tab{padding:8px 0}.tab.active{border-bottom:2px solid #2563eb;color:#2563eb;font-weight:550}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.column{border:1px solid var(--col-border);background:var(--col-bg);padding:12px;border-radius:8px}.column-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--col-ink);margin-bottom:16px;font-weight:600}.column-head span{font-size:11px;font-weight:500}.person-card{border:1px solid #e4e5e7;border-radius:8px;background:white;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px #00000004}.person-card:last-child{margin-bottom:0}.person-card h3{font-size:14px;margin-bottom:4px}.job{font-size:11px;color:#737780}.card-owner{display:flex;align-items:center;gap:6px;margin-top:13px;font-size:11px;color:#616570}.date{display:flex;align-items:center;gap:5px;margin-top:9px;font-size:10px;color:#797e87;font-weight:400}.date .icon{width:12px;height:12px}.pill{font-size:10px;padding:3px 7px;border-radius:5px;display:inline-block;background:#f3f4f6;color:#5e6571}.pill.amber{background:#fff7da;color:#926c12}.pill.blue{background:#eaf2ff;color:#315f9c}.pill.green{background:#eaf7ee;color:#2d784b}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}.metric{border:1px solid var(--line);border-radius:8px;padding:14px 18px}.metric .label{font-size:11px;color:var(--muted)}.metric strong{display:block;font-size:25px;font-weight:600;margin-top:3px}.metric strong small{font-size:12px;color:#777;font-weight:400}.card{border:1px solid var(--line);border-radius:8px;background:white;overflow:hidden;margin-bottom:20px}.card-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.taskrow{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.taskrow:last-child{border:0}.taskrow p{font-size:11px;color:var(--muted);margin-top:4px}.taskrow .meta{display:flex;gap:7px;align-items:center;font-size:11px;color:var(--muted);margin-top:6px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}th{font-weight:500;color:#727781;font-size:11px;background:#fafafa}th,td{padding:11px 16px;border-bottom:1px solid #eef0f2;white-space:nowrap}tbody tr:last-child td{border:0}.shortage{color:#b77911;font-weight:600}.assistant{border-left:1px solid var(--line);display:flex;flex-direction:column;background:#fff;min-width:0}.assistant-head{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line)}.assistant-head h2{font-size:14px}.messages{padding:22px 18px;flex:1}.message{font-size:12px;line-height:1.9;margin-bottom:22px}.message.user{background:#f4f5f7;border:0;display:block;border-radius:8px;padding:12px;margin:0 0 24px}.speaker{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;margin-bottom:12px}.response-item{padding:11px 0;border-bottom:1px solid var(--line)}.response-item:last-child{border:0}.response-item b{font-size:12px;display:block}.response-item p{font-size:11px;color:#69717e;margin-top:5px}.source{display:inline-block;font-size:10px;color:#737b88;background:#f7f8fa;padding:2px 6px;border-radius:4px;margin-top:6px}.composer-preview{margin:16px;border:1px solid var(--line);border-radius:9px;padding:12px;box-shadow:0 1px 2px #00000006;color:#9197a1;font-size:12px;height:108px;display:flex;flex-direction:column;justify-content:space-between}.send-decoration{align-self:flex-end;background:#2563eb;color:white;border-radius:5px;padding:5px 13px;font-size:11px}.draft-tag{font-size:10px;color:#9297a0}.bottom-note{color:#868c96;font-size:10px;margin-top:14px}.activity-strip{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}.activity-strip p{margin-top:10px;font-size:12px;color:#727781}@media(min-width:1440px){.shell{grid-template-columns:208px minmax(0,1fr) 320px}.main{padding:32px}.person-card{padding:18px}.board{gap:18px}}@media(max-width:1000px){.shell{grid-template-columns:160px minmax(0,1fr)}.assistant{grid-column:2}.main{padding:22px}.board{gap:9px}.column{padding:8px}.sidebar{grid-row:1/3}.summary{gap:8px}}@media(max-width:650px){.shell{display:block}.sidebar{padding:14px}.sidebar nav,.sidebar-foot .user,.sidebar-foot .readonly{display:none}.brand{padding:0 0 12px}.sidebar-foot{padding:0}.main{padding:20px 14px}.board{grid-template-columns:1fr}.assistant{border-top:1px solid var(--line)}.summary{grid-template-columns:repeat(3,1fr)}.metric{padding:10px}}
</style></head><body><div id="app"></div><script>
const icons={"panel-left": "<svg aria-hidden=\"true\" class=\"icon\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <rect width=\"18\" height=\"18\" x=\"3\" y=\"3\" rx=\"2\" /> <path d=\"M9 3v18\" /> </svg>", "panel-right": "<svg aria-hidden=\"true\" class=\"icon\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <rect width=\"18\" height=\"18\" x=\"3\" y=\"3\" rx=\"2\" /> <path d=\"M15 3v18\" /> </svg>", "pencil": "<svg aria-hidden=\"true\" class=\"icon\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z\" /> <path d=\"m15 5 4 4\" /> </svg>", "briefcase-business": "<svg aria-hidden=\"true\" class=\"icon\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M12 12h.01\" /> <path d=\"M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2\" /> <path d=\"M22 13a18.15 18.15 0 0 1-20 0\" /> <rect width=\"20\" height=\"14\" x=\"2\" y=\"6\" rx=\"2\" /> </svg>", "layout-dashboard": "<svg aria-hidden=\"true\" class=\"icon\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <rect width=\"7\" height=\"9\" x=\"3\" y=\"3\" rx=\"1\" /> <rect width=\"7\" height=\"5\" x=\"14\" y=\"3\" rx=\"1\" /> <rect width=\"7\" height=\"9\" x=\"14\" y=\"12\" rx=\"1\" /> <rect width=\"7\" height=\"5\" x=\"3\" y=\"16\" rx=\"1\" /> </svg>", "square-check": "<svg aria-hidden=\"true\" class=\"icon\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <rect width=\"18\" height=\"18\" x=\"3\" y=\"3\" rx=\"2\" /> <path d=\"m16 9-5.5 5.5L8 12\" /> </svg>", "users": "<svg aria-hidden=\"true\" class=\"icon\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\" /> <path d=\"M16 3.128a4 4 0 0 1 0 7.744\" /> <path d=\"M22 21v-2a4 4 0 0 0-3-3.87\" /> <circle cx=\"9\" cy=\"7\" r=\"4\" /> </svg>", "calendar": "<svg aria-hidden=\"true\" class=\"icon\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M8 2v3\" /> <path d=\"M16 2v3\" /> <rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\" /> <path d=\"M3 9h18\" /> </svg>", "workflow": "<svg aria-hidden=\"true\" class=\"icon\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <rect width=\"8\" height=\"8\" x=\"3\" y=\"3\" rx=\"2\" /> <path d=\"M7 11v4a2 2 0 0 0 2 2h4\" /> <rect width=\"8\" height=\"8\" x=\"13\" y=\"13\" rx=\"2\" /> </svg>", "message-circle": "<svg aria-hidden=\"true\" class=\"icon\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719\" /> </svg>", "plus": "<svg aria-hidden=\"true\" class=\"icon\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M5 12h14\" /> <path d=\"M12 5v14\" /> </svg>", "chevron-right": "<svg aria-hidden=\"true\" class=\"icon\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"m9 18 6-6-6-6\" /> </svg>", "chevron-down": "<svg aria-hidden=\"true\" class=\"icon\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"m6 9 6 6 6-6\" /> </svg>", "arrow-up": "<svg aria-hidden=\"true\" class=\"icon\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"m5 12 7-7 7 7\" /> <path d=\"M12 19V5\" /> </svg>", "arrow-down": "<svg aria-hidden=\"true\" class=\"icon\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M12 5v14\" /> <path d=\"m19 12-7 7-7-7\" /> </svg>", "arrow-up-down": "<svg aria-hidden=\"true\" class=\"icon\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"m21 16-4 4-4-4\" /> <path d=\"M17 20V4\" /> <path d=\"m3 8 4-4 4 4\" /> <path d=\"M7 4v16\" /> </svg>", "check": "<svg aria-hidden=\"true\" class=\"icon\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M20 6 9 17l-5-5\" /> </svg>"};
const icon=name=>icons[name]||icons['square-check'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mode=new URLSearchParams(location.search).get('view')==='materials'?'materials':'recruiting';
const owner=name=>`<span class="avatar">${name.slice(0,2).toUpperCase()}</span>${name}`;
const navItems=mode==='materials'?[['layout-dashboard','ダッシュボード'],['square-check','タスク'],['briefcase-business','資材'],['users','仕入先'],['workflow','業務フロー']]:[['layout-dashboard','ダッシュボード'],['users','応募者'],['briefcase-business','求人'],['square-check','タスク'],['workflow','業務フロー']];
const sidebar=`<aside class="sidebar"><div class="brand"><span class="brand-mark">${icon('briefcase-business')}</span>${mode==='materials'?'キジトラ資材管理':'キジトラ採用管理'}</div><nav aria-label="画面構成の例">${navItems.map(([i,n])=>`<div class="nav-item ${n===(mode==='materials'?'資材':'応募者')?'active':''}">${icon(i)}${n}</div>`).join('')}</nav><div class="sidebar-foot"><div class="switches"><a href="?view=recruiting" ${mode==='recruiting'?'aria-current="page"':''}>採用</a><a href="?view=materials" ${mode==='materials'?'aria-current="page"':''}>資材</a></div><p class="readonly">架空データ・撮影用／表示のみ</p><div class="user">${owner('Wada')}</div></div></aside>`;
const applicants=[{name:'森田 詩織',job:'カスタマーサクセス',stage:0,owner:'Wada',date:'10/27',next:'書類の確認'},{name:'青井 拓真',job:'業務アプリエンジニア',stage:0,owner:'Ikeda',date:'10/28',next:'実務経験の確認'},{name:'榎本 千春',job:'カスタマーサクセス',stage:0,owner:'Sato',date:'10/28',next:'書類の確認'},{name:'白川 直人',job:'業務アプリエンジニア',stage:1,owner:'Ikeda',date:'10/27 14:00',next:'一次面接'},{name:'野々村 彩',job:'営業企画',stage:1,owner:'Wada',date:'10/28 11:00',next:'最終面接'},{name:'高瀬 悠里',job:'カスタマーサクセス',stage:2,owner:'Sato',date:'10/30',next:'条件面談'}];
const stageStyles=[['書類選考','#fffdf3','#eee5be','#80620b'],['面接','#f4f8fe','#d9e6f8','#2457a5'],['内定','#f3faf5','#d8eadf','#276642']];
function recruiting(){return `<div class="heading"><h1>応募者</h1><span class="period">2026年10月</span></div><div class="toolbar"><span class="filter-label">すべての求人 ${icon('chevron-down')}</span><span class="muted" style="font-size:11px">応募者 6名</span></div><div class="tabs"><span class="tab active">カンバン</span><span class="tab">一覧</span></div><div class="board">${stageStyles.map(([name,bg,border,ink],stage)=>`<section class="column" style="--col-bg:${bg};--col-border:${border};--col-ink:${ink}"><div class="column-head">${name}<span>${applicants.filter(a=>a.stage===stage).length}</span></div>${applicants.filter(a=>a.stage===stage).map(a=>`<article class="person-card"><h3>${a.name}</h3><p class="job">${a.job}</p><div class="card-owner">${owner(a.owner)}</div><div class="date">${icon('calendar')}<span>${a.date} · ${a.next}</span></div></article>`).join('')}</section>`).join('')}</div><div class="activity-strip"><h2>最近の更新</h2><p>10/26 09:10　白川 直人さんの一次面接日程を登録</p><p>10/26 08:40　森田 詩織さんの応募書類を受領</p></div>`}
const stocks=[['M-101','梱包用ダンボール A4',120,200,'10/29','北星包装'],['M-102','緩衝材ロール',8,10,'10/28','北星包装'],['M-103','封かんテープ',42,20,'11/02','青海商事'],['M-104','配送ラベル',1600,1000,'11/05','青海商事'],['M-105','結束バンド',340,200,'11/04','若草資材']];
function materials(){return `<div class="heading"><h1>資材</h1><span class="period">2026年10月26日</span></div><div class="summary"><div class="metric"><span class="label">管理資材</span><strong>5 <small>品目</small></strong></div><div class="metric"><span class="label">基準在庫を下回る資材</span><strong>2 <small>品目</small></strong></div><div class="metric"><span class="label">発注確認のタスク</span><strong>2 <small>件</small></strong></div></div><section class="card"><div class="card-head"><h2>発注の確認</h2><span class="pill amber">ToDo 2</span></div><div class="taskrow"><div><h3>梱包用ダンボール A4の発注数量を確認</h3><div class="meta">${owner('Wada')}<span>10/26</span></div></div><span class="pill amber">ToDo</span></div><div class="taskrow"><div><h3>緩衝材ロールの納期を確認</h3><div class="meta">${owner('Tanaka')}<span>10/26</span></div></div><span class="pill amber">ToDo</span></div></section><section class="card"><div class="card-head"><h2>在庫一覧</h2><span class="draft-tag">数量・納期を確認</span></div><div class="table-wrap"><table><thead><tr><th>資材名</th><th>残数</th><th>基準在庫</th><th>入荷予定</th><th>仕入先</th></tr></thead><tbody>${stocks.map(([id,name,n,min,date,supplier])=>`<tr><td><b style="font-weight:500">${name}</b><div class="muted" style="font-size:10px">${id}</div></td><td class="${n<min?'shortage':''}">${n.toLocaleString()}</td><td>${min.toLocaleString()}</td><td>${date}</td><td>${supplier}</td></tr>`).join('')}</tbody></table></div></section>`}
function assistant(){const recruitment=mode==='recruiting';return `<aside class="assistant"><div class="assistant-head"><h2>AIアシスタント</h2>${icon('panel-right')}</div><div class="messages"><div class="message user">${recruitment?'今日、確認する応募者と、面接前に揃える情報を教えて。':'基準在庫を下回っている資材と、確認することを教えて。'}</div><div class="message"><div class="speaker">${icon('message-circle')}AIアシスタント</div><p>${recruitment?'確認する仕事は2件です。':'基準在庫を下回る資材は2品目です。'}</p>${recruitment?`<div class="response-item"><b>森田 詩織さんの応募書類</b><p>カスタマーサクセス職の書類を受領しています。職務経験を確認し、面接へ進めるか判断してください。</p><span class="source">応募者記録 · 森田 詩織</span></div><div class="response-item"><b>白川 直人さんの面接準備</b><p>一次面接は10/27 14:00です。応募書類と求人要件を確認し、質問を整理できます。</p><span class="source">面接予定 · 10/27</span></div>`:`<div class="response-item"><b>梱包用ダンボール A4</b><p>残数120、基準200で80不足しています。入荷予定10/29を踏まえ、必要な発注数量を確認してください。</p><span class="source">資材台帳 · M-101</span></div><div class="response-item"><b>緩衝材ロール</b><p>残数8、基準10で2不足しています。10/28の入荷に間に合うか、仕入先へ確認してください。</p><span class="source">資材台帳 · M-102</span></div>`}</div></div><div class="composer-preview" aria-label="入力欄の表示例"><span>確認したいことを入力</span><span class="send-decoration">送信</span></div></aside>`}
document.querySelector('#app').innerHTML=`<div class="shell">${sidebar}<main class="main">${mode==='materials'?materials():recruiting()}</main>${assistant()}</div>`;
</script></body></html>
